<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergency Calls</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #cfd8dc; font-family: system-ui, sans-serif; color: #111; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 86px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; gap:8px; flex-wrap:wrap; pointer-events: none;
      font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .panel {
      background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(6px);
      padding: 10px 16px; border-radius: 6px; font-size: 14px;
    }
    #overlay {
      position: fixed; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(225, 232, 236, 0.88); text-align: center; gap: 16px;
    }
    #overlay.active { display: flex; }
    button {
      padding: 12px 28px; font-size: 15px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      background: #111; color: #fff; border: none; border-radius: 4px; cursor: pointer;
    }
    #controls-hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      font-size: 12px; opacity: 0.75; pointer-events: none;
    }
  
    body { background:#1d3345; color:#f4f8ff; }
    #brand {position:fixed;top:20px;left:24px;pointer-events:none;text-shadow:0 2px 12px #132235;}
    #brand b {font-size:clamp(20px,4vw,30px);letter-spacing:.06em} #brand span {color:#ff5858}
    #brand small {display:block; font-size:10px;letter-spacing:.24em;margin-top:5px;color:#d4e6f1}
    .panel {background:rgba(15,32,49,.86);border:1px solid #7694a555;border-radius:12px;box-shadow:0 8px 24px #0c1b2922;font-size:12px;letter-spacing:.04em;}
    #overlay {background:rgba(12,26,42,.93);padding:24px;} #overlay p {max-width:580px;line-height:1.65;color:#d8e6f1} #overlay h1 {font-size:clamp(24px,5vw,48px)}
    button {background:#df343e;border-radius:10px;box-shadow:0 4px 20px #0003;}
    #controls-hint {background:#102336ce;padding:10px 16px;border-radius:20px;opacity:1;white-space:nowrap;}
    #touch {display:none;position:fixed;bottom:25px;left:18px;right:18px;justify-content:space-between;}
    #touch div {display:flex;gap:10px} #touch button {touch-action:none;width:62px;height:62px;padding:0;background:#142f46d9;border:1px solid #d0e5f666;font-size:14px;user-select:none;}
    @media(pointer:coarse) {#touch {display:flex} #controls-hint {bottom:100px;font-size:10px} .panel {padding:10px 8px;font-size:10px} #hud {left:12px;right:12px;gap:6px}}
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="brand"><b>EMERGENCY <span>CALLS</span></b><small>FDEC DISPATCH · UNIT 01</small></div>
  <div id="hud">
    <div class="panel">Impacts: <span id="impacts">0</span> / 5</div>
    <div class="panel">Lead on Gallagher: <span id="gap">40</span>m</div>
    <div class="panel">Job Site: <span id="distance">2,500</span>m</div>
    <div class="panel">Speed: <span id="speed">0</span> km/h</div>
  </div>

  <div id="road-status" style="position:fixed;top:138px;left:20px;font-size:11px;font-weight:700;letter-spacing:.07em;color:#ffe1a3;background:#142638d9;padding:8px 12px;border-radius:8px;pointer-events:none">KEEP RIGHT AT ROAD WORK</div>
  <div id="controls-hint">W / ↑ Accelerate · A D / ← → Steer · SPACE Brake</div>

  <div id="touch"><div><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button></div><div><button data-key="Space">BRAKE</button><button data-key="ArrowUp">GO</button></div></div>
  <div id="overlay">
    <h1 id="overlay-title">RESPONSE INTERRUPTED</h1>
    <p id="overlay-sub">Reach the job site before Gallagher Fire.</p>
    <button id="restart-btn">Start Dispatch</button>
    <button id="menu-btn" style="background:#31485c;display:none">Return to Main Menu</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
    import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
    import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
    import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
    import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

    // --- 1. SCENE, FOG & RENDERER ---
    const FOG_COLOR = 0x6e7e8c;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(FOG_COLOR);
    // Atmospheric fog retains visibility of collapses ahead.
    scene.fog = new THREE.FogExp2(FOG_COLOR, 0.0055);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 360);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const composer=new EffectComposer(renderer);
    composer.setPixelRatio(Math.min(window.devicePixelRatio,1.25));
    composer.addPass(new RenderPass(scene,camera));
    const heatPass=new ShaderPass({uniforms:{tDiffuse:{value:null},time:{value:0},zones:{value:Array.from({length:4},()=>new THREE.Vector4(-2,-2,0,0))},aspect:{value:window.innerWidth/window.innerHeight}},
      vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
      fragmentShader:`uniform sampler2D tDiffuse;uniform float time;uniform float aspect;uniform vec4 zones[4];varying vec2 vUv;void main(){vec2 shift=vec2(0.);for(int i=0;i<4;i++){vec2 d=vUv-zones[i].xy;d.x*=aspect;float mask=exp(-dot(d,d)/max(.00001,zones[i].z*zones[i].z))*zones[i].w;shift+=vec2(sin(vUv.y*150.+time*13.),cos(vUv.x*110.+time*9.))*.0016*mask;}gl_FragColor=texture2D(tDiffuse,clamp(vUv+shift,vec2(.001),vec2(.999)));}`});
    composer.addPass(heatPass);
    const bloomPass=new UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),.22,.5,1.25);composer.addPass(bloomPass);composer.addPass(new OutputPass());
    let bloomPulse=0;

    // --- 2. LIGHTING ---
    const hemiLight = new THREE.HemisphereLight(0xddeeff, 0x4a5568, 0.9);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfff5e4, 1.6);
    dirLight.position.set(40, 70, 30);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.bias = -0.0005;
    dirLight.shadow.normalBias = 0.035;
    Object.assign(dirLight.shadow.camera,{left:-65,right:65,top:75,bottom:-75,near:1,far:240});
    dirLight.shadow.camera.updateProjectionMatrix();
    scene.add(dirLight.target);
    scene.add(dirLight);

    // --- 3. SHARED MATERIALS & CONSTANTS ---
    const ROAD_WIDTH = 36;
    const CHUNK_LENGTH = 60;
    const NUM_CHUNKS = 6;

    function createRoadTextures() {
      const w=512,h=512;
      const diff=document.createElement('canvas'),bump=document.createElement('canvas'),rough=document.createElement('canvas');
      diff.width=bump.width=rough.width=w;diff.height=bump.height=rough.height=h;
      const dc=diff.getContext('2d'),bc=bump.getContext('2d'),rc=rough.getContext('2d');
      dc.fillStyle='#222528';dc.fillRect(0,0,w,h);
      bc.fillStyle='#808080';bc.fillRect(0,0,w,h);
      rc.fillStyle='#a0a0a0';rc.fillRect(0,0,w,h);
      const imgData=dc.getImageData(0,0,w,h),bumpData=bc.getImageData(0,0,w,h);
      for(let i=0;i<imgData.data.length;i+=4) {
        const noise=(Math.random()-.5)*35;
        for(let channel=0;channel<3;channel++)imgData.data[i+channel]=Math.min(255,Math.max(0,imgData.data[i+channel]+noise));
        const bNoise=128+Math.random()*50;
        bumpData.data[i]=bumpData.data[i+1]=bumpData.data[i+2]=bNoise;
      }
      dc.putImageData(imgData,0,0);bc.putImageData(bumpData,0,0);
      // Lane paint stays in road geometry to preserve the five-lane layout.
      const wrap=(tex,color=false)=>{
        tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
        if(color)tex.colorSpace=THREE.SRGBColorSpace;
        tex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return tex;
      };
      return {map:wrap(new THREE.CanvasTexture(diff),true),bumpMap:wrap(new THREE.CanvasTexture(bump)),roughnessMap:wrap(new THREE.CanvasTexture(rough))};
    }
    const roadTex=createRoadTextures();
    const realisticRoadMat=new THREE.MeshStandardMaterial({...roadTex,bumpScale:.04,roughness:.75,metalness:.1});
    const roadMat=realisticRoadMat;
    function roadGeometry(width,length) {
      const geo=new THREE.PlaneGeometry(width,length),uv=geo.attributes.uv;
      // World-sized tiling gives asphalt the same grain size on roads and cross streets.
      for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*width/5,uv.getY(i)*length/5);
      return geo;
    }
    const buildingMat = new THREE.MeshStandardMaterial({ color: 0x5c6670, roughness: 0.9 });
    const hazardMat = new THREE.MeshStandardMaterial({ color: 0x8d3b2e, roughness: 0.7 });
    const snowMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 });

    function createFacadeTextures(baseHex,litChance=.45) {
      const w=512,h=512;
      const diff=document.createElement('canvas'),emis=document.createElement('canvas'),bump=document.createElement('canvas');
      diff.width=emis.width=bump.width=w;diff.height=emis.height=bump.height=h;
      const dc=diff.getContext('2d'),ec=emis.getContext('2d'),bc=bump.getContext('2d');
      dc.fillStyle=baseHex;dc.fillRect(0,0,w,h);bc.fillStyle='#c8c8c8';bc.fillRect(0,0,w,h);ec.fillStyle='#000';ec.fillRect(0,0,w,h);
      for(let i=0;i<900;i++){dc.fillStyle=Math.random()>.5?'rgba(255,255,255,.03)':'rgba(0,0,0,.05)';dc.fillRect(Math.random()*w,Math.random()*h,2,18);}
      const cols=4,rows=8,padX=24,padY=16,cellW=w/cols,cellH=h/rows;
      for(let r=0;r<rows;r++)for(let c=0;c<cols;c++) {
        const wx=c*cellW+padX,wy=r*cellH+padY,ww=cellW-padX*2,wh=cellH-padY*2;
        bc.fillStyle='#303030';bc.fillRect(wx-3,wy-3,ww+6,wh+6);
        dc.fillStyle='rgba(255,255,255,.18)';dc.fillRect(wx-4,wy+wh,ww+8,4);
        if(Math.random()<litChance){const color=Math.random()>.3?'#ffdfa8':'#a8d5ff';dc.fillStyle=color;dc.fillRect(wx,wy,ww,wh);ec.fillStyle=color;ec.fillRect(wx,wy,ww,wh);}
        else {dc.fillStyle='#18242e';dc.fillRect(wx,wy,ww,wh);}
      }
      const wrap=(tex,color=false)=>{tex.wrapS=tex.wrapT=THREE.RepeatWrapping;if(color)tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());return tex;};
      return {map:wrap(new THREE.CanvasTexture(diff),true),emissiveMap:wrap(new THREE.CanvasTexture(emis),true),bumpMap:wrap(new THREE.CanvasTexture(bump))};
    }
    const facadeSets=[createFacadeTextures('#566b7d',.5),createFacadeTextures('#6c7d89',.35),createFacadeTextures('#405568',.6)];
    const facadeMaterials=facadeSets.map(set=>new THREE.MeshStandardMaterial({...set,color:0xffffff,emissive:0xffeedd,emissiveIntensity:.85,bumpScale:.15,roughness:.82}));
    const roofMat=new THREE.MeshStandardMaterial({color:0x68727a,roughness:.95});
    function facadeGeometry(w,h,d) {
      const geo=new THREE.BoxGeometry(w,h,d),uv=geo.attributes.uv;
      for(let face=0;face<6;face++)if(face!==2&&face!==3)for(let i=face*4;i<face*4+4;i++) {
        uv.setXY(i,uv.getX(i)*(face<2?d:w)/16,uv.getY(i)*h/32);
      }
      return geo;
    }
    function setFacadeGlow(b,color){const mats=Array.isArray(b.material)?b.material:[b.material];for(const m of new Set(mats))if(m.emissiveMap)m.emissive.setHex(color);}

    // Fire engine, with forward cab, equipment body, hose bed and roof ladder.
    const car = new THREE.Group();
    const red = new THREE.MeshStandardMaterial({color:0xc82432,metalness:.35,roughness:.32});
    const white = new THREE.MeshStandardMaterial({color:0xe9f0f3,roughness:.38});
    const dark = new THREE.MeshStandardMaterial({color:0x172634,metalness:.35,roughness:.38});
    const glass = new THREE.MeshStandardMaterial({color:0x193c55,metalness:.6,roughness:.18});
    const chrome = new THREE.MeshStandardMaterial({color:0xb5c5cf,metalness:.85,roughness:.24});
    function box(parent,w,h,d,x,y,z,mat) {
      const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
      m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
    }
    box(car,2.45,.45,6.1,0,.78,0,dark);
    box(car,2.5,1.9,3.7,0,1.65,1.05,red);
    box(car,2.5,2.15,2.2,0,1.8,-1.95,red);
    box(car,2.58,.16,2.3,0,2.93,-1.95,white);
    box(car,2.18,.85,.055,0,2.3,-3.065,glass);
    box(car,.07,.85,.07,0,2.3,-3.1,white);
    box(car,2.53,.2,5.9,0,1.37,-.05,white);
    box(car,2.62,.25,.25,0,.65,3.05,chrome);
    box(car,2.62,.28,.25,0,.65,-3.13,chrome);
    box(car,1.35,.45,.05,0,1.1,-3.075,chrome);
    for(const side of [-1,1]) {
      box(car,.045,.75,1.35,side*1.26,2.3,-1.95,glass);
      box(car,.24,.4,.4,side*1.42,2,-2.65,dark);
      box(car,.22,.5,.06,side*1.05,1.05,2.93,new THREE.MeshBasicMaterial({color:0xff302b}));
      box(car,.45,.28,.06,side*.91,1.12,-3.09,new THREE.MeshBasicMaterial({color:0xffedbb}));
      for(const z of [-2.05,1.45,2.35]) {
        const tire=new THREE.Mesh(new THREE.CylinderGeometry(.53,.53,.36,20),dark);
        tire.rotation.z=Math.PI/2;tire.position.set(side*1.23,.55,z);car.add(tire);
        const hub=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.38,16),chrome);
        hub.rotation.z=Math.PI/2;hub.position.copy(tire.position);car.add(hub);
      }
      for(const z of [-.2,.9,2]) {
        box(car,.045,1,1,side*1.26,1.95,z,chrome);
        for(let y=1.55;y<2.4;y+=.13) box(car,.055,.018,.96,side*1.29,y,z,dark);
        box(car,.065,.06,.28,side*1.3,1.65,z,white);
      }
    }
    // Rear roll-up equipment door and high-visibility chevrons.
    box(car,1.8,1.15,.05,0,1.95,2.925,chrome);
    for(let y=1.5;y<2.5;y+=.13) box(car,1.76,.018,.065,0,y,2.94,dark);
    const sign=document.createElement('canvas');sign.width=512;sign.height=256;
    const ctx=sign.getContext('2d');ctx.fillStyle='#b91f2e';ctx.fillRect(0,0,512,256);
    ctx.fillStyle='#ffde45';
    for(let x=-256;x<768;x+=100) {ctx.beginPath();ctx.moveTo(x,256);ctx.lineTo(x+50,256);ctx.lineTo(x+306,0);ctx.lineTo(x+256,0);ctx.fill();}
    ctx.fillStyle='#a91e2c';ctx.fillRect(64,58,384,140);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 112px sans-serif';ctx.fillText('FDEC',256,167);
    const signMat=new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sign)});
    const label=new THREE.Mesh(new THREE.PlaneGeometry(1.9,.85),signMat);label.position.set(0,1.9,2.97);car.add(label);
    for(const side of [-1,1]) {
      const badge=new THREE.Mesh(new THREE.PlaneGeometry(1.35,.6),signMat);badge.rotation.y=side*Math.PI/2;badge.position.set(side*1.28,1.1,-1.9);car.add(badge);
    }
    box(car,2.15,.12,3.6,0,2.66,1.05,chrome);
    const hoseMat=new THREE.MeshStandardMaterial({color:0xbda77b,roughness:.95});
    for(let x=-.7;x<=.7;x+=.35) box(car,.24,.17,3.15,x,2.8,1.1,hoseMat);
    for(const x of [-.95,.95]) box(car,.09,.12,4.7,x,3.02,.3,chrome);
    for(let z=-2;z<2.7;z+=.35) box(car,1.9,.08,.08,0,3.02,z,chrome);
    box(car,1.65,.12,.44,0,3.1,-2,dark);
    const beacons=[];
    for(const side of [-1,1]) {
      const mat=new THREE.MeshBasicMaterial({color:side<0?0xff243d:0x319cff});
      beacons.push(box(car,.65,.22,.4,side*.44,3.27,-2,mat));
    }
    const beaconGlow=new THREE.PointLight(0xff2440,8,12,2);beaconGlow.position.set(0,3.4,0);car.add(beaconGlow);
    const headlights=new THREE.SpotLight(0xffedcc,85,65,.48,.6,1.3);
    headlights.position.set(0,1,-3.2);headlights.target.position.set(0,0,-30);car.add(headlights,headlights.target);
    scene.add(car);

    // --- 5. TRAILING WEATHER HAZE (visual atmosphere) ---
    const trailingHaze = new THREE.Mesh(
      new THREE.BoxGeometry(80, 40, 10),
      new THREE.MeshBasicMaterial({ color: 0x627d8c, transparent: true, opacity: 0.65 })
    );
    scene.add(trailingHaze);

    // --- 6. WORLD CHUNKS (ROAD, COLLAPSING BUILDINGS, DEBRIS) ---
    const chunks = [];
    let frontageSerial=0;
    let collapseSerial=0;
    

    function createChunk(zStart) {
      const group = new THREE.Group();
      group.position.z = zStart;

      const poles=[];const signals=[];
      const intersection = Math.abs(Math.round(zStart / CHUNK_LENGTH)) % 3 === 2;
      // Road surface
      const road = new THREE.Mesh(roadGeometry(ROAD_WIDTH, CHUNK_LENGTH), roadMat);
      road.rotation.x = -Math.PI / 2;
      road.receiveShadow = true;
      group.add(road);
      // Center each road tile on its actual scenery span: continuous asphalt.
      road.position.z=-CHUNK_LENGTH/2;
      const stripe=new THREE.MeshStandardMaterial({color:0xe9d08c,roughness:.85});
      const curb=new THREE.MeshStandardMaterial({color:0xb6c0c5});
      if(intersection) {
        const cross=new THREE.Mesh(roadGeometry(90,18),roadMat);cross.rotation.x=-Math.PI/2;cross.position.set(0,.012,-30);cross.receiveShadow=true;group.add(cross);
        for(const side of [-1,1]) for(let x=-14;x<=14;x+=2.5) box(group,1.3,.025,2.5,x,.04,-30+side*12,white);
      }
      for(const side of [-1,1]) {
        if(!intersection) box(group,1,.25,CHUNK_LENGTH,side*18.5,.08,-30,curb);
        if(!intersection) box(group,.12,.025,CHUNK_LENGTH,side*15,.018,-30,white);
        // Shared center lane bounded by solid/dashed yellow; white divides through lanes.
        for(let z=-5;z>-60;z-=10) {
          if(!intersection || Math.abs(z+30)>11) {
            box(group,.12,.025,4,side*9,.025,z,white);
            box(group,.12,.025,4,side*2.75,.025,z,stripe);
          }
        }
        if(!intersection) box(group,.13,.025,60,side*3,.025,-30,stripe);

      }

      // Three utility poles and luminaires along each non-intersection block.
      if(!intersection)for(const z of [-5,-25,-45]) {
        const pole=box(group,.26,10,.26,-18.9,5,z,new THREE.MeshStandardMaterial({color:0x67513f,roughness:.95}));
        box(group,2.3,.15,.18,-18.9,9.6,z,chrome);
        box(group,3,.13,.15,-17.5,8.2,z,dark);
        const lampMat=new THREE.MeshBasicMaterial({color:0xffe3ae});
        const lamp=box(group,.85,.1,.5,-16.1,8.08,z,lampMat);
        const transformer=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,1.15,12),chrome);transformer.position.set(-18.45,8.4,z);group.add(transformer);
        for(const dx of [-.85,0,.85]) {
          const points=[];for(let j=0;j<=10;j++){const t=j/10;points.push(new THREE.Vector3(-18.9+dx,9.85-Math.sin(t*Math.PI)*.5,z-20*t));}
          const cable=new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),new THREE.LineBasicMaterial({color:0x202a31}));group.add(cable);
          box(group,.13,.3,.13,-18.9+dx,9.85,z,white);
        }
        poles.push({z,lamp,transformer,passed:false,mode:null,seed:Math.random()*20});
      }
      if(intersection) {
        for(const dir of [-1,1]) {
          box(group,.22,8,.22,dir===-1?18:-18,4,-30-dir*13,dark);
          box(group,33,.18,.18,0,8,-30-dir*13,dark);
          for(const x of [-12,-6,6,12]) {
            const housing=new THREE.Group();housing.position.set(x,7.4,-30-dir*13);housing.rotation.y=dir===-1?0:Math.PI;group.add(housing);
            box(housing,.62,1.8,.4,0,0,0,dark);
            const lenses=[];
            for(let i=0;i<3;i++) {const lens=new THREE.Mesh(new THREE.CircleGeometry(.21,16),new THREE.MeshBasicMaterial({color:0x16202a}));lens.position.set(0,.55-i*.55,.215);housing.add(lens);lenses.push(lens);}
            signals.push({lenses,cross:false});
          }

        const desired=i?chasePool[i-1].mesh.position.x:q.lane;
        const blockers=[...traffic,...chasePool.filter((o,j)=>j!==i&&j<=q.count)];
        let best=desired,bestScore=-Infinity;
        for(const lane of [-12,-6,0,6,12]) {
          let score=-Math.abs(lane-desired)*.25-Math.abs(lane-v.position.x)*.06;
          for(const o of blockers) {
            const dz=(o.mesh.position.z-v.position.z)*q.direction;
            if(dz>-6&&dz<45&&Math.abs(o.mesh.position.x-lane)<3)score-=70;
          }
          for(const c of chunks) {
            if(c.workZone&&Math.abs(c.workLane-lane)<3&&Math.abs(c.group.position.z-35-v.position.z)<50)score-=70;
            if(c.rubble.some(r=>r.userData.hazard&&Math.abs(r.position.x-lane)<4&&Math.abs(c.group.position.z+r.position.z-v.position.z)<40))score-=70;
          }
          if(score>bestScore){bestScore=score;best=lane;}
        }
        const old=v.position.x;v.position.x=THREE.MathUtils.damp(old,best,2.3,dt);
        v.rotation.y=(q.direction===1?Math.PI:0)+q.direction*(v.position.x-old)/Math.max(.001,dt)*.025;
        const speed=i?THREE.MathUtils.clamp(((chasePool[i-1].mesh.position.z-v.position.z)*q.direction-16)*1.4+57,38,68):57;
        v.position.z+=q.direction*speed*dt;
        if(t.lights){const flash=Math.sin(q.age*20+i)>0;t.lights[0].material.color.setHex(flash?0xff2030:0x401018);t.lights[1].material.color.setHex(flash?0x0e233c:0x258cff);}
        if(Math.abs(v.position.z-state.carZ)<5.3&&Math.abs(v.position.x-state.carX)<2.25) {
          t.hit=true;state.speed*=.55;flashLight(state.carX,1,state.carZ,0xffa52e,55);state.impacts++;state.shake=1;
          if(state.impacts>=5)triggerGameOver('Fire truck disabled by collision damage.');
        }
      }
      if(q.age>16||q.direction===1&&chasePool[q.count].mesh.position.z>state.carZ+50) {
        chasePool.forEach(t=>t.mesh.visible=false);chase=null;chaseTimer=28+Math.random()*18;
      }
    }

    // 68-second coordinated traffic cycle: green, yellow and all-red clearance.
    let cityTime=0,polesPassed=0,nextElectrical=16+Math.floor(Math.random()*15),outageThrough=0;
    function signalState(c) {
      const phase=(cityTime+c.signalOffset)%68;
      return {main:phase<32?'green':phase<36?'yellow':'red',cross:phase>=38&&phase<62?'green':phase>=62&&phase<66?'yellow':'red'};
    }
    const crossPool=Array.from({length:8},()=>{const t=makeTraffic(Math.random()<.5?0:1);t.mesh.visible=false;t.active=false;return t;});
    function resetUtilities(){cityTime=0;polesPassed=0;nextElectrical=16+Math.floor(Math.random()*15);outageThrough=0;crossPool.forEach(t=>{t.active=false;t.mesh.visible=false;});}
    function transformerBurst(p,c) {
      const z=c.group.position.z+p.z;
      flashLight(-18.45,8.7,z,0x9ceaff,260);microSparks(-18.45,8.7,z);
      burst(-18.45,8.7,z,35);burst(-18.45,8.7,z,10,true);
      const mat=new THREE.MeshBasicMaterial({color:0x9ceaff,transparent:true,opacity:1});mat.color.multiplyScalar(4);
      const flash=new THREE.Mesh(new THREE.SphereGeometry(1.3,10,8),mat);flash.position.set(-18.45,8.7,z);scene.add(flash);
      effects.push({mesh:flash,v:new THREE.Vector3(),age:0,life:.45,dust:false,flash:true});
      for(let j=0;j<3;j++) {
        const pts=[];for(let k=0;k<7;k++)pts.push(new THREE.Vector3(-18.45+(Math.random()-.5)*2,8.7-k*.45,z+(Math.random()-.5)*2));
        const arc=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x9ceaff,transparent:true,opacity:1}));scene.add(arc);arc.material.color.multiplyScalar(5);
        effects.push({mesh:arc,v:new THREE.Vector3(),age:0,life:.3,dust:false,flash:false,arc:true,arcBase:new Float32Array(arc.geometry.attributes.position.array)});
      }
      p.mode='out';p.transformer.material=dark;
    }
    function updateUtilities(dt) {
      cityTime+=dt;
      const ordered=chunks.flatMap(c=>c.poles.map(p=>({p,c,z:c.group.position.z+p.z}))).sort((a,b)=>b.z-a.z);
      for(const {p,c,z} of ordered)if(!p.passed&&state.carZ<=z) {
        p.passed=true;polesPassed++;
        if(polesPassed>=nextElectrical) {
          transformerBurst(p,c);outageThrough=polesPassed+5;nextElectrical=polesPassed+16+Math.floor(Math.random()*15);
        }
      }
      let ahead=0;
      for(const {p,z} of ordered) {
        if(!p.passed&&z<state.carZ) {ahead++;if(polesPassed+ahead<=outageThrough&&!p.mode)p.mode=Math.random()<.5?'out':'flicker';}
        const lit=p.mode!=='out'&&(p.mode!=='flicker'||Math.sin(cityTime*19+p.seed)+Math.sin(cityTime*43+p.seed)>.1);
        p.lamp.material.color.setHex(lit?0xffe3ae:0x18212b);
      }
      for(const c of chunks)if(c.intersection) {
        const sig=signalState(c);
        for(const head of c.signals) {
          const color=head.cross?sig.cross:sig.main;
          head.lenses.forEach((l,i)=>l.material.color.setHex(color===['red','yellow','green'][i]?[0xff3025,0xffc42e,0x38f07a][i]:0x15202a));
        }
        const z=c.group.position.z-30;
        if(sig.cross==='green'&&Math.abs(z-state.carZ)<200&&(c.crossTimer-=dt)<=0) {
          for(const direction of [-1,1]) {
            const t=crossPool.find(t=>!t.active);if(!t)break;
            t.active=true;t.hit=false;t.direction=direction;t.mesh.visible=true;t.mesh.rotation.set(0,-direction*Math.PI/2,0);
            t.mesh.position.set(-direction*40,0,z+(direction===1?4:-4));t.speed=12+Math.random()*3;
          }
          c.crossTimer=4.5;
        }
      }
      for(const t of crossPool)if(t.active) {
        const v=t.mesh;
        if(!t.hit) {
          const c=chunks.find(c=>c.intersection&&Math.abs(c.group.position.z-30-v.position.z)<8);
          const distance=-t.direction*v.position.x-20;
          const hold=c&&signalState(c).cross!=='green'&&distance>=0;
          const blocked=crossPool.some(o=>o!==t&&o.active&&o.direction===t.direction&&Math.abs(o.mesh.position.z-v.position.z)<2&&(o.mesh.position.x-v.position.x)*t.direction>0&&(o.mesh.position.x-v.position.x)*t.direction<8);
          if(!blocked)v.position.x+=t.direction*(hold?Math.min(t.speed,Math.max(0,distance*3)):t.speed)*dt;
          if(Math.abs(v.position.z-state.carZ)<5.5&&Math.abs(v.position.x-state.carX)<2.25){t.hit=true;state.impacts++;state.speed*=.55;flashLight(state.carX,1,state.carZ,0xffa52e,55);state.shake=1;if(state.impacts>=5)triggerGameOver('Fire truck disabled by collision damage.');}
        }
        if(Math.abs(v.position.x)>45||v.position.z>state.carZ+55){t.active=false;v.visible=false;}
      }
    }

    // --- 7. BLIZZARD PARTICLE SYSTEM ---
    const SNOW_COUNT = 1200;
    const snowGeo = new THREE.BufferGeometry();
    const snowPos = new Float32Array(SNOW_COUNT * 3);
    for (let i = 0; i < SNOW_COUNT * 3; i += 3) {
      snowPos[i] = (Math.random() - 0.5) * 70;
      snowPos[i + 1] = Math.random() * 25;
      snowPos[i + 2] = (Math.random() - 0.5) * 90;
    }
    snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
    const snowPoints = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.25 }));
    scene.add(snowPoints);

    // --- 8. GAME STATE & INPUT ---
    const keys = {};
    window.addEventListener('keydown', e => {if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys[e.code]=true;});
    window.addEventListener('blur',()=>{for(const k in keys) keys[k]=false;});
    document.querySelectorAll('[data-key]').forEach(button=>{
      button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);keys[button.dataset.key]=true;});
      for(const name of ['pointerup','pointercancel','lostpointercapture']) button.addEventListener(name,()=>keys[button.dataset.key]=false);
    });
    window.addEventListener('keyup', e => (keys[e.code] = false));

    const JOB_DISTANCE=2500;
    let state = {};
    function resetGame() {
      clearAdvancedFx();
      shockFov=0;shockSide=0;camera.fov=65;camera.updateProjectionMatrix();
      resetChase();resetUtilities();
      effects.forEach(e=>{scene.remove(e.mesh);e.mesh.material.dispose();if(e.arc||e.ownedGeometry)e.mesh.geometry.dispose();});effects.length=0;
      chunks.forEach(c => {scene.remove(c.group);c.group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.userData.ownedFire){o.material.map.dispose();o.material.dispose();}if(o.userData.ownedFacade){const m=o.userData.ownedFacade;for(const key of ['map','emissiveMap','bumpMap'])m[key].dispose();m.dispose();}});});
      chunks.length = 0;
      for (let i = 0; i < NUM_CHUNKS; i++) {
        chunks.push(createChunk(-i * CHUNK_LENGTH));
      }

      state = {
        running: true,
        speed: 22,
        steerVel: 0,
        carX: 12,
        carZ: 0,
        rivalZ: 45,
        rivalSpeed: 31, // Gallagher Fire closes the distance at the existing chase rate
        impacts: 0,
        shake: 0
      };

      traffic.forEach((t,i)=>{t.lastJunction=null;placeTraffic(t,i,true);});
      car.position.set(12, 0, 0);
      car.rotation.set(0, 0, 0);
      for(const key in keys)keys[key]=false;
      document.getElementById('impacts').textContent='0';
      document.getElementById('gap').textContent='45';
      document.getElementById('distance').textContent=JOB_DISTANCE.toLocaleString();
      document.getElementById('overlay').classList.remove('active');
    }

    function showMainMenu() {
      state.running=false;
      for(const key in keys)keys[key]=false;
      document.getElementById('overlay-title').textContent='EMERGENCY CALLS';
      document.getElementById('overlay-sub').textContent='FDEC dispatch: a job is 2.5 km ahead. Beat Gallagher Fire to the site. Keep your lead and avoid five impacts. Snow, traffic and city hazards will slow your response.';
      document.getElementById('restart-btn').textContent='Start Dispatch';
      document.getElementById('menu-btn').style.display='none';
      document.getElementById('overlay').classList.add('active');
    }
    function showResult(title,message,won=false) {
      state.running=false;
      document.getElementById('overlay-title').textContent=title;
      document.getElementById('overlay-sub').textContent=message;
      document.getElementById('restart-btn').textContent=won?'Run Again':'Try Again';
      document.getElementById('menu-btn').style.display='block';
      document.getElementById('overlay').classList.add('active');
    }
    function triggerGameOver(reason) {
      if(!state.running)return;
      const rivalWon=state.rivalZ-state.carZ<=4;
      showResult(rivalWon?'GALLAGHER FIRE GOT THE JOB':'RESPONSE STOPPED',reason);
    }
    document.getElementById('restart-btn').addEventListener('click',()=>{enableImpactAudio();resetGame();});
    document.getElementById('menu-btn').addEventListener('click',showMainMenu);
    resetGame();showMainMenu();

    // --- 9. MAIN LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const flashBlink=Math.floor(clock.elapsedTime*4)%2===0;
      for(const chunk of chunks)for(const equipment of chunk.obstacles)if(equipment.userData.isDumpTruck) {
        equipment.userData.hazards.forEach((lamp,index)=>lamp.material.color.setHex((index===0?flashBlink:!flashBlink)?0xffaa00:0x442200));
      }
      const flash=Math.sin(clock.elapsedTime*14)>0;
      beacons[0].material.color.setHex(flash?0xff3040:0x50121b);
      beacons[1].material.color.setHex(flash?0x102b48:0x45aaff);
      beaconGlow.color.setHex(flash?0xff3040:0x45aaff);
      beaconGlow.intensity=flash?9:6;

      if (state.running) {
        // Acceleration & Braking
        const accel = keys['KeyW'] || keys['ArrowUp'];
        const brake = keys['Space'] || keys['KeyS'] || keys['ArrowDown'];
        if (accel) state.speed += 28 * dt;
        else if (brake) state.speed -= 45 * dt;
        else state.speed -= 10 * dt; // Natural drag
        state.speed = THREE.MathUtils.clamp(state.speed, 8, 52);

        // Steering with slight drift inertia
        const steerInput = (keys['KeyA'] || keys['ArrowLeft'] ? -1 : 0) +
                           (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0);
        state.steerVel = THREE.MathUtils.lerp(state.steerVel, steerInput * 16, 8 * dt);
        state.carX += state.steerVel * dt;
        state.carX = THREE.MathUtils.clamp(state.carX, -ROAD_WIDTH / 2 + 1.3, ROAD_WIDTH / 2 - 1.3);

        // Advance forward (-Z)
        state.carZ -= state.speed * dt;
        car.position.set(state.carX, 0, state.carZ);
        car.rotation.y = -state.steerVel * 0.025;
        car.rotation.z = -state.steerVel * 0.015; // Body roll

        // Advance Gallagher Fire along the same route (original pursuit mechanics).
        state.rivalSpeed = Math.min(44, state.rivalSpeed + 0.35 * dt);
        state.rivalZ -= state.rivalSpeed * dt;
        trailingHaze.position.set(0, 15, state.rivalZ);

        const gap = Math.max(0, Math.round(state.rivalZ - state.carZ));
        if (gap <= 4) triggerGameOver('Gallagher Fire overtook you and claimed the job. Get there first on your next dispatch.');

        // Recycle road chunks & animate collapsing buildings
        chunks.forEach(chunk => {
          if (chunk.group.position.z - CHUNK_LENGTH > state.carZ + 30) {
            const minZ = Math.min(...chunks.map(c => c.group.position.z));
            recycleChunk(chunk, minZ - CHUNK_LENGTH);
          }

          chunk.buildings.forEach(b=>updateBuilding(chunk,b,dt));
          for(const r of chunk.rubble) {
            if(!state.running||!r.userData.hazard||r.userData.hit)continue;
            if(Math.abs(r.position.x-state.carX)<r.userData.halfW+1.25&&Math.abs(chunk.group.position.z+r.position.z-state.carZ)<r.userData.halfD+3.1) {
              // One damage event per rubble pile, while its visible debris stays in place.
              chunk.rubble.forEach(piece=>piece.userData.hit=true);
              state.impacts++;state.speed*=.5;state.shake=1;
              if(state.impacts>=5)triggerGameOver('Fire truck disabled by collision damage.');
            }
          }

          // Obstacle AABB collision check
          chunk.obstacles.forEach(obs => {
            if (!state.running || obs.userData.hit) return;
            const conePos=obs.getWorldPosition(new THREE.Vector3());
            const worldZ = conePos.z;
            if (Math.abs(worldZ - state.carZ) < (obs.userData.halfD??.35)+3.1 && Math.abs(conePos.x - state.carX) < obs.userData.halfW + 1.25) {
              obs.userData.hit = true;
              if(!obs.userData.persistent)obs.visible = false;
              state.impacts += 1;
              state.speed *= 0.55;flashLight(state.carX,1,state.carZ,0xffa52e,55); // Lose momentum on crash
              state.shake = 1.0;
              if (state.impacts >= 5) triggerGameOver('Vehicle totaled after 5 impacts.');
            }
          });
        });

        if(state.running) {updateUtilities(dt);updateTraffic(dt);updateChase(dt);}
        // Rough pavement causes continuous drag; potholes add a stronger slowdown.
        // Road damage does not count as a vehicle impact.
        let roughRoad=false, pothole=false;
        for(const chunk of chunks) if(chunk.workZone) {
          const localZ=state.carZ-chunk.group.position.z;
          const workZ=chunk.workLane<0?-60-localZ:localZ;
          if(Math.abs(state.carX-chunk.workLane)<3.3&&workZ<-27&&workZ>-53) {
            roughRoad=true;
            pothole ||= chunk.damageWorld.some(d=>Math.hypot(state.carX-d.x,localZ-d.z)<d.r+1);
          }
        }
        if(roughRoad) {
          state.speed=Math.max(8,state.speed-(pothole?58:37)*dt);
          state.shake=Math.max(state.shake,pothole?.24:.1);
        }
        document.getElementById('road-status').textContent=roughRoad?(pothole?'POTHOLE · SLOWDOWN':'ROUGH ROAD · SLOWDOWN'):'WATCH FOR ROAD WORK / FALLING DEBRIS';

        // Update HUD
        document.getElementById('impacts').textContent = state.impacts;
        document.getElementById('gap').textContent = gap;
        document.getElementById('speed').textContent = Math.round(state.speed * 3.6);
        const remaining=Math.max(0,Math.ceil(JOB_DISTANCE+state.carZ));
        document.getElementById('distance').textContent=remaining.toLocaleString();
        if(state.running&&remaining===0)showResult('FDEC GOT THE JOB!','You reached the job site before Gallagher Fire. Dispatch complete.',true);
      }

      updateEffects(dt);updateAdvancedFx(dt);

      // Blizzard snow movement relative to car
      const posArr = snowPoints.geometry.attributes.position.array;
      for (let i = 0; i < posArr.length; i += 3) {
        posArr[i] -= 12 * dt; // Crosswind
        posArr[i + 1] -= 6 * dt;
        if (posArr[i] < -35) posArr[i] = 35;
        if (posArr[i + 1] < 0) posArr[i + 1] = 25;
      }
      snowPoints.position.z = state.carZ - 20;
      snowPoints.geometry.attributes.position.needsUpdate = true;

      shockFov=THREE.MathUtils.damp(shockFov,0,4,dt);
      const newFov=65+shockFov;
      if(Math.abs(camera.fov-newFov)>.001){camera.fov=newFov;camera.updateProjectionMatrix();}
      // Chase camera + impact/proximity shake
      state.shake = Math.max(0, state.shake - dt * 2.5);
      const proximityShake = Math.max(0, (25 - (state.rivalZ - state.carZ)) / 25) * 0.25;
      const totalShake = state.shake * 0.6 + proximityShake;

      camera.position.set(
        state.carX * 0.75 + (Math.random() - 0.5) * totalShake + shockSide*shockFov*.08,
        5.3 + (Math.random() - 0.5) * totalShake,
        state.carZ + 11.5
      );
      camera.lookAt(state.carX * 0.5, 1.4, state.carZ - 18);

      // Move the light and target together to keep shadows around the response route.
      dirLight.target.position.set(state.carX*.5,0,state.carZ-25);
      dirLight.position.set(state.carX*.5+40,70,state.carZ+5);
      updateHeatZones();composer.render(dt);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);composer.setSize(window.innerWidth,window.innerHeight);
    });

    animate();
    window.emergencyCalls={scene,car,traffic,chunks,updateTraffic,resetGame,get state(){return state}};
  </script>
</body>
</html>
