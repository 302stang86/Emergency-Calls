<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergency Calls</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #cfd8dc; font-family: system-ui, sans-serif; color: #111; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 86px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; pointer-events: none;
      font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .panel {
      background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(6px);
      padding: 10px 16px; border-radius: 6px; font-size: 14px;
    }
    #overlay {
      position: fixed; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(225, 232, 236, 0.88); text-align: center; gap: 16px;
    }
    #overlay.active { display: flex; }
    button {
      padding: 12px 28px; font-size: 15px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      background: #111; color: #fff; border: none; border-radius: 4px; cursor: pointer;
    }
    #controls-hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      font-size: 12px; opacity: 0.75; pointer-events: none;
    }
  
    body { background:#1d3345; color:#f4f8ff; }
    #brand {position:fixed;top:20px;left:24px;pointer-events:none;text-shadow:0 2px 12px #132235;}
    #brand b {font-size:clamp(20px,4vw,30px);letter-spacing:.06em} #brand span {color:#ff5858}
    #brand small {display:block; font-size:10px;letter-spacing:.24em;margin-top:5px;color:#d4e6f1}
    .panel {background:rgba(15,32,49,.86);border:1px solid #7694a555;border-radius:12px;box-shadow:0 8px 24px #0c1b2922;font-size:12px;letter-spacing:.04em;}
    #overlay {background:rgba(12,26,42,.93);padding:24px;} #overlay h1 {font-size:clamp(24px,5vw,48px)}
    button {background:#df343e;border-radius:10px;box-shadow:0 4px 20px #0003;}
    #controls-hint {background:#102336ce;padding:10px 16px;border-radius:20px;opacity:1;white-space:nowrap;}
    #touch {display:none;position:fixed;bottom:25px;left:18px;right:18px;justify-content:space-between;}
    #touch div {display:flex;gap:10px} #touch button {touch-action:none;width:62px;height:62px;padding:0;background:#142f46d9;border:1px solid #d0e5f666;font-size:14px;user-select:none;}
    @media(pointer:coarse) {#touch {display:flex} #controls-hint {bottom:100px;font-size:10px} .panel {padding:10px 8px;font-size:10px} #hud {left:12px;right:12px;gap:6px}}
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="brand"><b>EMERGENCY <span>CALLS</span></b><small>STORM RESPONSE · UNIT 01</small></div>
  <div id="hud">
    <div class="panel">Impacts: <span id="impacts">0</span> / 5</div>
    <div class="panel">Storm Gap: <span id="gap">40</span>m</div>
    <div class="panel">Speed: <span id="speed">0</span> km/h</div>
  </div>

  <div id="road-status" style="position:fixed;top:138px;left:20px;font-size:11px;font-weight:700;letter-spacing:.07em;color:#ffe1a3;background:#142638d9;padding:8px 12px;border-radius:8px;pointer-events:none">KEEP RIGHT AT ROAD WORK</div>
  <div id="controls-hint">W / ↑ Accelerate · A D / ← → Steer · SPACE Brake</div>

  <div id="touch"><div><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button></div><div><button data-key="Space">BRAKE</button><button data-key="ArrowUp">GO</button></div></div>
  <div id="overlay">
    <h1 id="overlay-title">RESPONSE INTERRUPTED</h1>
    <p id="overlay-sub">Keep your response vehicle ahead of the storm.</p>
    <button id="restart-btn">Try Again</button>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // --- 1. SCENE, FOG & RENDERER ---
    const FOG_COLOR = 0x829aaa;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(FOG_COLOR);
    // Exponential fog creates the dense "whiteout" visibility wall
    scene.fog = new THREE.FogExp2(FOG_COLOR, 0.0055);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 360);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- 2. LIGHTING ---
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x6b7780, 1.1);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfff5e4, 1.4);
    dirLight.position.set(30, 60, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    scene.add(dirLight);

    // --- 3. SHARED MATERIALS & CONSTANTS ---
    const ROAD_WIDTH = 36;
    const CHUNK_LENGTH = 60;
    const NUM_CHUNKS = 6;

    const roadMat = new THREE.MeshStandardMaterial({ color: 0x2c3034, roughness: 0.85 });
    const buildingMat = new THREE.MeshStandardMaterial({ color: 0x5c6670, roughness: 0.9 });
    const hazardMat = new THREE.MeshStandardMaterial({ color: 0x8d3b2e, roughness: 0.7 });
    const snowMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 });

    // Fire engine, with forward cab, equipment body, hose bed and roof ladder.
    const car = new THREE.Group();
    const red = new THREE.MeshStandardMaterial({color:0xc82432,metalness:.35,roughness:.32});
    const white = new THREE.MeshStandardMaterial({color:0xe9f0f3,roughness:.38});
    const dark = new THREE.MeshStandardMaterial({color:0x172634,metalness:.35,roughness:.38});
    const glass = new THREE.MeshStandardMaterial({color:0x193c55,metalness:.6,roughness:.18});
    const chrome = new THREE.MeshStandardMaterial({color:0xb5c5cf,metalness:.85,roughness:.24});
    function box(parent,w,h,d,x,y,z,mat) {
      const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
      m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
    }
    box(car,2.45,.45,6.1,0,.78,0,dark);
    box(car,2.5,1.9,3.7,0,1.65,1.05,red);
    box(car,2.5,2.15,2.2,0,1.8,-1.95,red);
    box(car,2.58,.16,2.3,0,2.93,-1.95,white);
    box(car,2.18,.85,.055,0,2.3,-3.065,glass);
    box(car,.07,.85,.07,0,2.3,-3.1,white);
    box(car,2.53,.2,5.9,0,1.37,-.05,white);
    box(car,2.62,.25,.25,0,.65,3.05,chrome);
    box(car,2.62,.28,.25,0,.65,-3.13,chrome);
    box(car,1.35,.45,.05,0,1.1,-3.075,chrome);
    for(const side of [-1,1]) {
      box(car,.045,.75,1.35,side*1.26,2.3,-1.95,glass);
      box(car,.24,.4,.4,side*1.42,2,-2.65,dark);
      box(car,.22,.5,.06,side*1.05,1.05,2.93,new THREE.MeshBasicMaterial({color:0xff302b}));
      box(car,.45,.28,.06,side*.91,1.12,-3.09,new THREE.MeshBasicMaterial({color:0xffedbb}));
      for(const z of [-2.05,1.45,2.35]) {
        const tire=new THREE.Mesh(new THREE.CylinderGeometry(.53,.53,.36,20),dark);
        tire.rotation.z=Math.PI/2;tire.position.set(side*1.23,.55,z);car.add(tire);
        const hub=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.38,16),chrome);
        hub.rotation.z=Math.PI/2;hub.position.copy(tire.position);car.add(hub);
      }
      for(const z of [-.2,.9,2]) {
        box(car,.045,1,1,side*1.26,1.95,z,chrome);
        for(let y=1.55;y<2.4;y+=.13) box(car,.055,.018,.96,side*1.29,y,z,dark);
        box(car,.065,.06,.28,side*1.3,1.65,z,white);
      }
    }
    // Rear roll-up equipment door and high-visibility chevrons.
    box(car,1.8,1.15,.05,0,1.95,2.925,chrome);
    for(let y=1.5;y<2.5;y+=.13) box(car,1.76,.018,.065,0,y,2.94,dark);
    const sign=document.createElement('canvas');sign.width=512;sign.height=256;
    const ctx=sign.getContext('2d');ctx.fillStyle='#b91f2e';ctx.fillRect(0,0,512,256);
    ctx.fillStyle='#ffde45';
    for(let x=-256;x<768;x+=100) {ctx.beginPath();ctx.moveTo(x,256);ctx.lineTo(x+50,256);ctx.lineTo(x+306,0);ctx.lineTo(x+256,0);ctx.fill();}
    ctx.fillStyle='#a91e2c';ctx.fillRect(64,58,384,140);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 112px sans-serif';ctx.fillText('FDEC',256,167);
    const signMat=new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sign)});
    const label=new THREE.Mesh(new THREE.PlaneGeometry(1.9,.85),signMat);label.position.set(0,1.9,2.97);car.add(label);
    for(const side of [-1,1]) {
      const badge=new THREE.Mesh(new THREE.PlaneGeometry(1.35,.6),signMat);badge.rotation.y=side*Math.PI/2;badge.position.set(side*1.28,1.1,-1.9);car.add(badge);
    }
    box(car,2.15,.12,3.6,0,2.66,1.05,chrome);
    const hoseMat=new THREE.MeshStandardMaterial({color:0xbda77b,roughness:.95});
    for(let x=-.7;x<=.7;x+=.35) box(car,.24,.17,3.15,x,2.8,1.1,hoseMat);
    for(const x of [-.95,.95]) box(car,.09,.12,4.7,x,3.02,.3,chrome);
    for(let z=-2;z<2.7;z+=.35) box(car,1.9,.08,.08,0,3.02,z,chrome);
    box(car,1.65,.12,.44,0,3.1,-2,dark);
    const beacons=[];
    for(const side of [-1,1]) {
      const mat=new THREE.MeshBasicMaterial({color:side<0?0xff243d:0x319cff});
      beacons.push(box(car,.65,.22,.4,side*.44,3.27,-2,mat));
    }
    const beaconGlow=new THREE.PointLight(0xff2440,8,12,2);beaconGlow.position.set(0,3.4,0);car.add(beaconGlow);
    const headlights=new THREE.SpotLight(0xffedcc,85,65,.48,.6,1.3);
    headlights.position.set(0,1,-3.2);headlights.target.position.set(0,0,-30);car.add(headlights,headlights.target);
    scene.add(car);

    // --- 5. PURSUING COLLAPSE WALL ---
    const collapseWall = new THREE.Mesh(
      new THREE.BoxGeometry(80, 40, 10),
      new THREE.MeshBasicMaterial({ color: 0x627d8c, transparent: true, opacity: 0.65 })
    );
    scene.add(collapseWall);

    // --- 6. WORLD CHUNKS (ROAD, COLLAPSING BUILDINGS, DEBRIS) ---
    const chunks = [];
    let frontageSerial=0;
    let collapseSerial=0;
    

    function createChunk(zStart) {
      const group = new THREE.Group();
      group.position.z = zStart;

      const intersection = Math.abs(Math.round(zStart / CHUNK_LENGTH)) % 3 === 2;
      // Road surface
      const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, CHUNK_LENGTH), roadMat);
      road.rotation.x = -Math.PI / 2;
      road.receiveShadow = true;
      group.add(road);
      // Center each road tile on its actual scenery span: continuous asphalt.
      road.position.z=-CHUNK_LENGTH/2;
      const stripe=new THREE.MeshStandardMaterial({color:0xe9d08c,roughness:.85});
      const curb=new THREE.MeshStandardMaterial({color:0xb6c0c5});
      if(intersection) {
        const cross=new THREE.Mesh(new THREE.PlaneGeometry(90,18),roadMat);cross.rotation.x=-Math.PI/2;cross.position.set(0,.012,-30);cross.receiveShadow=true;group.add(cross);
        for(const side of [-1,1]) for(let x=-14;x<=14;x+=2.5) box(group,1.3,.025,2.5,x,.04,-30+side*12,white);
      }
      for(const side of [-1,1]) {
        if(!intersection) box(group,1,.25,CHUNK_LENGTH,side*18.5,.08,-30,curb);
        if(!intersection) box(group,.12,.025,CHUNK_LENGTH,side*15,.018,-30,white);
        // Shared center lane bounded by solid/dashed yellow; white divides through lanes.
        for(let z=-5;z>-60;z-=10) {
          if(!intersection || Math.abs(z+30)>11) {
            box(group,.12,.025,4,side*9,.025,z,white);
            box(group,.12,.025,4,side*2.75,.025,z,stripe);
          }
        }
        if(!intersection) box(group,.13,.025,60,side*3,.025,-30,stripe);
        const pole=box(group,.14,8,.14,side*18.8,4,-12,dark);
        box(group,2,.12,.18,side*17.9,8,-12,dark);
        box(group,.65,.08,.4,side*17.1,7.9,-12,new THREE.MeshBasicMaterial({color:0xffe3ae}));
      }

      if(!intersection) for(const direction of [-1,1]) {
        const arrow=new THREE.Group();arrow.position.set(0,.045,direction===-1?-18:-44);arrow.rotation.y=direction===-1?0:Math.PI;
        box(arrow,.16,.02,2.4,0,0,0,stripe);box(arrow,1.2,.02,.16,-.55,0,-1.2,stripe);
        const tip=box(arrow,.65,.02,.16,-.9,0,-1.02,stripe);tip.rotation.y=-.65;
        const tip2=box(arrow,.65,.02,.16,-.9,0,-1.38,stripe);tip2.rotation.y=.65;group.add(arrow);
      }
      // Flanking buildings that tilt/collapse as the player approaches
      const buildings = [];
      for (let side of [-1, 1]) {
        for (let i = 0; i < 2; i++) {
          if(intersection) continue;
          const frontage=frontageSerial++;
          if(frontage%7===6) {
            makeSpecialLot(group,side,-15-i*28,Math.floor(frontage/7)%4);
            continue;
          }
          const h = 18 + Math.random() * 24;
          const b = new THREE.Mesh(new THREE.BoxGeometry(10, h, 24), new THREE.MeshStandardMaterial({color:[0x566b7d,0x6c7d89,0x405568,0x78868d][Math.floor(Math.random()*4)],roughness:.85}));
          const windowMat=new THREE.MeshBasicMaterial({color:Math.random()<.5?0xe5c998:0x96bdcf});
          for(let y=3;y<h-1;y+=3.5) for(let z=-9;z<=9;z+=4.5)
            box(b,.06,1.5,1.8,-side*5.04,y-h/2,z,windowMat);
          box(b,10.4,.28,24.4,0,h/2+.14,0,white);
          for(let z=-10;z<=10;z+=5) box(b,.15,h,.15,-side*5.08,0,z,dark);
          b.position.set(side * (ROAD_WIDTH / 2 + 6.5), h / 2, -15 - i * 28);
          b.castShadow = true;
          b.userData = {
            side,
            shouldCollapse: Math.random() < 0.45,
            collapseProgress: 0
          };
          group.add(b);
          buildings.push(b);
        }
      }

      // Second city row fills sightlines through intersections and frontage gaps.
      for(const side of [-1,1]) for(let row=0;row<2;row++)for(let j=0;j<3;j++) {
        const z=-10-j*23;
        if(intersection&&Math.abs(z+30)<13)continue; // Preserve cross-street corridors.
        const height=24+Math.random()*34;
        const distant=new THREE.MeshStandardMaterial({color:[0x536673,0x687783,0x435b6c][(j+row)%3],roughness:.9});
        const tower=box(group,15,height,19,side*(46+row*22),height/2,z,distant);
        const wm=new THREE.MeshBasicMaterial({color:row?0x90a9b6:0xa8bfc7});
        for(let y=4;y<height-1;y+=5)for(let dz=-6;dz<=6;dz+=6)box(tower,.05,1.6,1.7,-side*7.53,y-height/2,dz,wm);
      }
      for(const side of [-1,1])box(group,70,.12,60,side*53,-.12,-30,new THREE.MeshStandardMaterial({color:0x718089,roughness:1}));
      // Standard orange road cones with reflective white bands
      const obstacles = [];
      const workRoot=new THREE.Group();group.add(workRoot);
      const workZone = !intersection && Math.abs(Math.round(zStart/CHUNK_LENGTH))%6===4;
      // Approach from local Z=0: taper from the left shoulder to the center line,
      // then a straight cone line protects the damaged left lane.
      const coneLayout=workZone?[
        [-6.8,-8],[-5.6,-12],[-4.4,-16],[-3.2,-20],[-2,-24],
        [-1,-28],[-1,-34],[-1,-40],[-1,-46],[-1,-52],
        [-2,-55],[-4.4,-55],[-6.8,-55]
      ]:[];
      const count = coneLayout.length;
      for (let i = 0; i < count; i++) {
        const obs = new THREE.Group();
        const coneOrange=new THREE.MeshStandardMaterial({color:0xff6819,roughness:.65});
        const reflective=new THREE.MeshStandardMaterial({color:0xf5f5ee,metalness:.18,roughness:.28,emissive:0x303028,emissiveIntensity:.15});
        box(obs,.9,.11,.9,0,.055,0,dark);
        // Stacked tapered sections form one continuous round cone with two white bands.
        const sections=[[.11,.38,coneOrange],[.38,.57,reflective],[.57,.78,coneOrange],[.78,.94,reflective],[.94,1.22,coneOrange]];
        const radius=y=>.34-(y-.11)/1.11*.29;
        for(const [bottom,top,mat] of sections) {
          const piece=new THREE.Mesh(new THREE.CylinderGeometry(radius(top),radius(bottom),top-bottom,32),mat);
          piece.position.y=(bottom+top)/2;piece.castShadow=true;piece.receiveShadow=true;obs.add(piece);
        }
        obs.position.set(coneLayout[i][0]+10,0,coneLayout[i][1]);
        obs.userData = { hit: false, halfW: .45 };
        workRoot.add(obs);
        obstacles.push(obs);
      }

      const damage=[];
      if(workZone) {
        const gravel=new THREE.MeshStandardMaterial({color:0x776b5b,roughness:1});
        const pitMat=new THREE.MeshStandardMaterial({color:0x161d23,roughness:1});
        const rough=new THREE.MeshStandardMaterial({color:0x48443d,roughness:1});
        box(workRoot,5.2,.035,24,5.5,.025,-40,gravel);
        // Jagged dark potholes, broken asphalt edges, and scattered gravel.
        for(const [x,z,r] of [[4.2,-33,1.05],[6.6,-39,1.2],[4,-46,1.25],[6,-49,.85]]) {
          const pit=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.045,9),pitMat);pit.position.set(x,.065,z);workRoot.add(pit);
          damage.push({x,z,r});
          for(let j=0;j<8;j++) {
            const angle=j*Math.PI/4;
            const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.13+Math.random()*.13,0),rough);
            rock.position.set(x+Math.cos(angle)*r,.12,z+Math.sin(angle)*r);rock.scale.y=.45;workRoot.add(rock);
          }
        }
        for(let i=0;i<38;i++) {
          const chip=box(workRoot,.08+Math.random()*.17,.035,.1+Math.random()*.2,3.2+Math.random()*4.7,.065,-29-Math.random()*22,rough);chip.rotation.y=Math.random()*Math.PI;
        }
        const signCanvas=document.createElement('canvas');signCanvas.width=512;signCanvas.height=256;
        const sc=signCanvas.getContext('2d');sc.fillStyle='#ff8a23';sc.fillRect(0,0,512,256);sc.strokeStyle='#20242a';sc.lineWidth=14;sc.strokeRect(10,10,492,236);sc.fillStyle='#172330';sc.textAlign='center';sc.font='bold 54px sans-serif';sc.fillText('ROAD WORK',256,85);sc.fillText('LANE CLOSED',256,150);sc.font='bold 42px sans-serif';sc.fillText('USE OPEN LANE',256,215);
        const sign=new THREE.Mesh(new THREE.PlaneGeometry(3,1.5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(signCanvas)}));sign.position.set(16,2.25,-3);workRoot.add(sign);box(workRoot,.12,1.6,.12,16,.8,-3,chrome);
      }
      scene.add(group);
      const chunk={group,buildings,obstacles,intersection,workZone,damage,workRoot,workLane:6,rubble:[]};
      configureWork(chunk);configureCollapse(chunk,zStart===0||zStart===-60);return chunk;

    }

    function recycleChunk(chunk, newZ) {
      chunk.rubble.forEach(r=>{chunk.group.remove(r);r.traverse(o=>{if(o.geometry)o.geometry.dispose();});});chunk.rubble=[];
      configureWork(chunk);
      // Preserve the intersection layout when recycling this tile.
      chunk.group.position.z = newZ;
      chunk.buildings.forEach(b => {
        b.rotation.z = 0;
        b.position.y = b.geometry.parameters.height / 2;
        b.userData.shouldCollapse = false;
        b.userData.collapseProgress = 0;
      });
      chunk.obstacles.forEach(obs => {
        obs.visible = true;
        obs.userData.hit = false;
        // Keep the construction taper intact after tile recycling.
      });
      configureCollapse(chunk,false);
    }

    function makeSpecialLot(group,side,z,type) {
      const lot=new THREE.Group();lot.position.set(side*25,0,z);group.add(lot);
      const groundMat=new THREE.MeshStandardMaterial({color:type===1?0x536d52:0x737775,roughness:1});
      box(lot,12,.12,23,0,.04,0,groundMat);
      if(type===0) { // Vacant lot with low perimeter fence.
        for(let dz=-10;dz<=10;dz+=2)box(lot,.12,1.5,.12,-side*5, .75,dz,chrome);
        box(lot,.08,.08,22,-side*5,1.2,0,chrome);
      } else if(type===1) {
        const leaf=new THREE.MeshStandardMaterial({color:0x315442,roughness:1});
        for(const dz of [-7,0,7]) {
          box(lot,.35,3,.35,side*1,1.5,dz,dark);
          const tree=new THREE.Mesh(new THREE.ConeGeometry(2.4,5,9),leaf);tree.position.set(side*1,4,dz);lot.add(tree);
        }
        box(lot,1.2,.12,20,-side*3,.15,0,white);
        for(const dz of [-5,5]) {box(lot,1.5,.15,2,-side*1,.7,dz,chrome);box(lot,.15,.7,2,-side*.35,1,dz,chrome);}
      } else if(type===2) {
        for(let i=0;i<18;i++) {
          const debris=new THREE.Mesh(new THREE.DodecahedronGeometry(.6+Math.random()*1.3),new THREE.MeshStandardMaterial({color:0x666b6c,roughness:1}));
          debris.position.set((Math.random()-.5)*9,.5+Math.random(),(Math.random()-.5)*19);debris.scale.y=.6;lot.add(debris);
        }
        box(lot,1,4,8,side*4,2,0,buildingMat);box(lot,8,2,1,0,1,-9,buildingMat);
      } else {
        box(lot,9,.5,16,0,4.8,0,white);box(lot,9,.3,16,0,4.55,0,red);
        for(const dz of [-5,5]) {box(lot,.2,4.5,.2,0,2.25,dz,chrome);box(lot,1.1,1.7,.8,-side*1,1,dz,red);box(lot,.8,.5,.83,-side*1,1.6,dz,dark);}
        box(lot,8,3.5,4,side*1,1.75,-9,white);box(lot,5,1.5,.05,side*1,2,-6.96,glass);
      }
    }
    function configureWork(c) {
      c.workLane=[-12,-6,0,6,12][Math.floor(Math.random()*5)];
      const reverse=c.workLane<0;
      c.workRoot.rotation.y=reverse?Math.PI:0;
      c.workRoot.position.set(c.workLane+(reverse?6:-6),0,reverse?-60:0);
      c.damageWorld=c.damage.map(d=>({x:c.workLane+(reverse?6-d.x:d.x-6),z:reverse?-60-d.z:d.z,r:d.r}));
    }
    function configureCollapse(c,safe) {
      c.buildings.forEach(b=>{b.userData.event=null;b.userData.shouldCollapse=false;b.material.emissive.setHex(0);});
      if(safe||c.workZone||!c.buildings.length)return;
      // One visible collapse per eligible city block; opening blocks stay safe.
      const side=collapseSerial++%2===0?1:-1;
      const options=c.buildings.filter(b=>b.userData.side===side);
      const b=(options.length?options:c.buildings)[0];
      b.userData.event={age:0,started:false,burst:false,landed:false,slab:null};
    }
    const effects=[];
    const fxGeo=new THREE.IcosahedronGeometry(1,0);
    function burst(x,y,z,count,dust=false) {
      for(let i=0;i<count;i++) {
        const mat=new THREE.MeshBasicMaterial({color:dust?0x9b9d98:(i%3===0?0xffb544:0x777d82),transparent:true,opacity:dust?.35:1,depthWrite:!dust});
        const mesh=new THREE.Mesh(fxGeo,mat);const size=dust?.7+Math.random():.06+Math.random()*.25;
        mesh.scale.setScalar(size);mesh.position.set(x,y,z);scene.add(mesh);
        effects.push({mesh,v:new THREE.Vector3((Math.random()-.5)*10,dust?2+Math.random()*3:3+Math.random()*8,(Math.random()-.5)*10),age:0,life:dust?4:2,dust});
      }
    }
    function updateEffects(dt) {
      for(let i=effects.length-1;i>=0;i--) {
        const e=effects[i];e.age+=dt;e.mesh.position.addScaledVector(e.v,dt);
        if(e.dust){e.v.multiplyScalar(Math.exp(-dt));e.mesh.scale.multiplyScalar(1+dt*.5);}else if(!e.flash)e.v.y-=14*dt;
        if(e.flash)e.mesh.scale.multiplyScalar(1+dt*4);
        e.mesh.material.opacity=(e.dust?.35:1)*Math.max(0,1-e.age/e.life);
        if(e.age>=e.life){scene.remove(e.mesh);e.mesh.material.dispose();effects.splice(i,1);}
      }
    }
    function updateBuilding(c,b,dt) {
      const e=b.userData.event;if(!e)return;
      const wz=c.group.position.z+b.position.z;
      if(!e.started&&wz-state.carZ<-205)return;
      if(wz>state.carZ+30&&!e.started)return;
      e.started=true;e.age+=dt;
      const side=b.userData.side;
      // Warning tremor and falling chips before the facade breaks away.
      if(e.age<1.25) {
        b.rotation.z=Math.sin(e.age*35)*.003;
        b.material.emissive.setHex(Math.sin(e.age*22)>0?0x231709:0);
        if(Math.random()<dt*9)burst(side*19.3,8,wz,2);
        return;
      }
      b.rotation.z=0;b.material.emissive.setHex(0);
      if(!e.burst) {
        e.burst=true;burst(side*19,12,wz,45);burst(side*19,11,wz,26,true);
        const flash=new THREE.Mesh(new THREE.SphereGeometry(2,12,8),new THREE.MeshBasicMaterial({color:0xffb84b,transparent:true,opacity:1}));flash.position.set(side*19,12,wz);scene.add(flash);
        effects.push({mesh:flash,v:new THREE.Vector3(),age:0,life:.5,dust:false,flash:true});
        const scar=box(c.group,.08,13,8,side*19.42,9,b.position.z,dark);c.rubble.push(scar);
        const slab=box(c.group,1.4,14,8,side*19,11,b.position.z,b.material);e.slab=slab;c.rubble.push(slab);
      }
      const t=Math.min(1,(e.age-1.25)/1.1);
      e.slab.position.set(side*(19-5.3*t),11-10*t*t,b.position.z);e.slab.rotation.z=side*t*1.2;
      if(t===1&&!e.landed) {
        e.landed=true;burst(side*13,1,wz,18,true);
        e.slab.userData={hazard:true,halfW:2.5,halfD:4,hit:false};
        for(let i=0;i<7;i++) {
          const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.4+Math.random()*.5,0),b.material);
          rock.position.set(side*(11.7+Math.random()*3),.3+Math.random()*.3,b.position.z+(Math.random()-.5)*6);rock.scale.y=.6;rock.castShadow=true;
          rock.userData={hazard:true,halfW:.6,halfD:.7,hit:false};c.group.add(rock);c.rubble.push(rock);
        }
      }
    }

    // Pooled traffic: independent world positions, reusable models and collision state.
    const traffic=[];
    const trafficColors=[0x275e91,0xc9d1d5,0xd0a447,0x426a57,0x983c44,0x252b38];
    function makeTraffic(style) {
      const v=new THREE.Group();
      const paint=new THREE.MeshStandardMaterial({color:trafficColors[Math.floor(Math.random()*trafficColors.length)],metalness:.4,roughness:.4});
      const length=style===3?5:style===2?4.9:4.3;
      box(v,2.05,.8,length,0,.9,0,paint);
      if(style===3) {box(v,2.03,1.35,3.8,0,1.9,.5,paint);box(v,1.8,.75,.05,0,1.85,-2.03,glass);}
      else {
        box(v,1.83,style===1?.95:.7,style===2?1.9:2.5,0,1.65,style===2?-1:0,glass);
        box(v,1.94,.12,style===2?2:2.65,0,style===1?2.18:2.06,style===2?-1:0,paint);
        if(style===2) {box(v,1.7,.08,1.8,0,1.34,1.2,dark);for(const side of [-1,1])box(v,.18,.42,1.9,side*.94,1.48,1.2,paint);}
      }
      for(const side of [-1,1]) {
        for(const z of [-length*.32,length*.32]) {
          const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.25,14),dark);wheel.rotation.z=Math.PI/2;wheel.position.set(side*1.03,.45,z);v.add(wheel);
          const hub=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.27,12),chrome);hub.rotation.z=Math.PI/2;hub.position.copy(wheel.position);v.add(hub);
        }
        box(v,.38,.19,.06,side*.7,.95,length/2+.02,new THREE.MeshBasicMaterial({color:0xfb3533}));
        box(v,.4,.18,.06,side*.7,.95,-length/2-.02,new THREE.MeshBasicMaterial({color:0xffefcc}));
      }
      scene.add(v);return {mesh:v,length,parked:false,hit:false,push:0,laneTimer:0,turn:null,turnDone:false};
    }
    for(let i=0;i<6;i++)traffic.push(makeTraffic(i%4));
    function placeTraffic(t,index,initial=false) {
      t.parked=index%3===0;t.side=Math.random()<.5?-1:1;
      t.direction=index%2===0?-1:1; // -Z outbound, +Z oncoming.
      t.hit=false;t.push=0;t.turn=null;t.turnDone=false;t.plan=null;t.lastJunction=null;
      const side=t.direction===-1?1:-1;
      const x=t.parked?t.side*16.5:side*(Math.random()<.5?6:12);
      t.mesh.rotation.set(0,t.direction===1?Math.PI:0,0);t.mesh.visible=true;
      const z=initial?-140-index*75:Math.min(state.carZ-300,...traffic.filter(o=>o!==t).map(o=>o.mesh.position.z))-65-Math.random()*35;
      t.mesh.position.set(x,0,z);t.targetX=x;t.speed=9+Math.random()*5;t.laneTimer=4+Math.random()*5;
      if(t.parked)for(const c of chunks)if(c.intersection&&Math.abs(z-(c.group.position.z-30))<18)t.mesh.position.z-=28;
    }
    function updateTraffic(dt) {
      for(let i=0;i<traffic.length;i++) {
        const t=traffic[i],v=t.mesh,dir=t.direction,base=dir===1?Math.PI:0;
        if(v.position.z>state.carZ+45||Math.abs(v.position.x)>43) {placeTraffic(t,i);continue;}
        if(t.hit) {
          v.position.x+=t.push*dt;t.push*=Math.exp(-2.1*dt);
          if(t.parked)v.position.x=THREE.MathUtils.damp(v.position.x,t.side*21,2.8,dt);
          continue;
        }
        if(!t.parked) {
          if(t.turn) {
            const q=t.turn;q.progress=Math.min(1,q.progress+t.speed*dt/(Math.PI*6));
            const angle=q.progress*Math.PI/2;
            v.position.x=q.x+q.side*12*(1-Math.cos(angle));v.position.z=q.z+dir*12*Math.sin(angle);
            v.rotation.y=base+dir*q.side*angle;
            if(q.progress===1){t.turn=null;t.turnDone=true;t.exitSide=q.side;}
          } else if(t.turnDone)v.position.x+=t.exitSide*t.speed*dt;
          else {
            // Plan left turns early. Both directions enter the shared center lane.
            if(!t.plan)for(const c of chunks)if(c.intersection) {
              const junction=c.group.position.z-30;
              const distance=(junction-v.position.z)*dir;
              if(distance>25&&distance<65&&t.lastJunction!==junction) {
                t.lastJunction=junction;
                if(Math.random()<.55)t.plan={junction,left:Math.random()<.65};
              }
            }
            let target=t.targetX;
            const workAhead=chunks.find(c=>c.workZone&&Math.sign(c.workLane)===(dir===-1?1:-1)&&v.position.z-c.group.position.z<30&&v.position.z-c.group.position.z>-60);
            if(t.plan&&chunks.some(c=>c.workZone&&c.workLane===0&&Math.abs(c.group.position.z-v.position.z)<80))t.plan=null;
            if(t.plan)target=t.plan.left?0:(dir===-1?12:-12);
            else if(workAhead)target=(dir===-1?1:-1)*(Math.abs(workAhead.workLane)===6?12:6);
            else if((t.laneTimer-=dt)<=0) {
              const next=(dir===-1?1:-1)*(Math.abs(t.targetX)===6?12:6);
              if(traffic.every(o=>o===t||Math.abs(o.mesh.position.z-v.position.z)>18||Math.abs(o.mesh.position.x-next)>2.5))t.targetX=next;
              t.laneTimer=5+Math.random()*5;target=t.targetX;
            }
            let speed=t.speed;
            for(const o of traffic)if(o!==t&&!o.hit&&Math.abs(o.mesh.position.x-v.position.x)<2.6) {
              const ahead=(o.mesh.position.z-v.position.z)*dir;
              if(ahead>0&&ahead<16)speed=Math.min(speed,Math.max(0,(ahead-7)*1.5));
            }
            // Yield center-lane entry and left turns to conflicting traffic.
            if(t.plan&&t.plan.left) {
              const conflict=traffic.some(o=>o!==t&&!o.parked&&!o.hit&&
                ((Math.abs(o.mesh.position.x)<2.6&&Math.abs(o.mesh.position.z-v.position.z)<24)||
                (o.direction!==dir&&Math.abs(o.mesh.position.z-t.plan.junction)<26)));
              if(conflict){target=v.position.x;speed=0;}
            }
            const old=v.position.x;v.position.x=THREE.MathUtils.damp(old,target,1.8,dt);v.rotation.y=base+dir*(v.position.x-old)/Math.max(dt,.001)*.04;
            const nextZ=v.position.z+dir*speed*dt;
            if(t.plan) {
              const start=t.plan.junction-dir*12;
              if((start-v.position.z)*dir>=0&&(start-nextZ)*dir<=0) {
                if(Math.abs(v.position.x-target)<.6&&speed>0) {
                  v.position.z=start;t.turn={x:v.position.x,z:start,side:t.plan.left?dir:-dir,progress:0};t.plan=null;
                } else speed=0;
              }
            }
            if(!t.turn)v.position.z+=dir*speed*dt;
          }
        }
        if(state.running&&Math.abs(v.position.z-state.carZ)<3.1+t.length/2&&Math.abs(v.position.x-state.carX)<2.25) {
          t.hit=true;t.push=(t.parked?t.side:(v.position.x>=state.carX?1:-1))*9;
          state.impacts++;state.speed*=.55;state.shake=1;
          if(state.impacts>=5)triggerGameOver('Vehicle totaled after 5 impacts.');
        }
      }
    }

    // --- 7. BLIZZARD PARTICLE SYSTEM ---
    const SNOW_COUNT = 1200;
    const snowGeo = new THREE.BufferGeometry();
    const snowPos = new Float32Array(SNOW_COUNT * 3);
    for (let i = 0; i < SNOW_COUNT * 3; i += 3) {
      snowPos[i] = (Math.random() - 0.5) * 70;
      snowPos[i + 1] = Math.random() * 25;
      snowPos[i + 2] = (Math.random() - 0.5) * 90;
    }
    snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
    const snowPoints = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.25 }));
    scene.add(snowPoints);

    // --- 8. GAME STATE & INPUT ---
    const keys = {};
    window.addEventListener('keydown', e => {if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys[e.code]=true;});
    window.addEventListener('blur',()=>{for(const k in keys) keys[k]=false;});
    document.querySelectorAll('[data-key]').forEach(button=>{
      button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);keys[button.dataset.key]=true;});
      for(const name of ['pointerup','pointercancel','lostpointercapture']) button.addEventListener(name,()=>keys[button.dataset.key]=false);
    });
    window.addEventListener('keyup', e => (keys[e.code] = false));

    let state = {};
    function resetGame() {
      effects.forEach(e=>{scene.remove(e.mesh);e.mesh.material.dispose();});effects.length=0;
      chunks.forEach(c => {scene.remove(c.group);c.group.traverse(o=>{if(o.geometry)o.geometry.dispose();});});
      chunks.length = 0;
      for (let i = 0; i < NUM_CHUNKS; i++) {
        chunks.push(createChunk(-i * CHUNK_LENGTH));
      }

      state = {
        running: true,
        speed: 22,
        steerVel: 0,
        carX: 12,
        carZ: 0,
        collapseZ: 45,
        collapseSpeed: 31, // Constantly chases the player
        impacts: 0,
        shake: 0
      };

      traffic.forEach((t,i)=>{t.lastJunction=null;placeTraffic(t,i,true);});
      car.position.set(12, 0, 0);
      car.rotation.set(0, 0, 0);
      document.getElementById('overlay').classList.remove('active');
    }

    document.getElementById('restart-btn').addEventListener('click', resetGame);
    resetGame();

    function triggerGameOver(reason) {
      state.running = false;
      document.getElementById('overlay-sub').textContent = reason;
      document.getElementById('overlay').classList.add('active');
    }

    // --- 9. MAIN LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const flash=Math.sin(clock.elapsedTime*14)>0;
      beacons[0].material.color.setHex(flash?0xff3040:0x50121b);
      beacons[1].material.color.setHex(flash?0x102b48:0x45aaff);
      beaconGlow.color.setHex(flash?0xff3040:0x45aaff);
      beaconGlow.intensity=flash?9:6;

      if (state.running) {
        // Acceleration & Braking
        const accel = keys['KeyW'] || keys['ArrowUp'];
        const brake = keys['Space'] || keys['KeyS'] || keys['ArrowDown'];
        if (accel) state.speed += 28 * dt;
        else if (brake) state.speed -= 45 * dt;
        else state.speed -= 10 * dt; // Natural drag
        state.speed = THREE.MathUtils.clamp(state.speed, 8, 52);

        // Steering with slight drift inertia
        const steerInput = (keys['KeyA'] || keys['ArrowLeft'] ? -1 : 0) +
                           (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0);
        state.steerVel = THREE.MathUtils.lerp(state.steerVel, steerInput * 16, 8 * dt);
        state.carX += state.steerVel * dt;
        state.carX = THREE.MathUtils.clamp(state.carX, -ROAD_WIDTH / 2 + 1.3, ROAD_WIDTH / 2 - 1.3);

        // Advance forward (-Z)
        state.carZ -= state.speed * dt;
        car.position.set(state.carX, 0, state.carZ);
        car.rotation.y = -state.steerVel * 0.025;
        car.rotation.z = -state.steerVel * 0.015; // Body roll

        // Advance pursuing collapse front (gradually speeds up)
        state.collapseSpeed = Math.min(44, state.collapseSpeed + 0.35 * dt);
        state.collapseZ -= state.collapseSpeed * dt;
        collapseWall.position.set(0, 15, state.collapseZ);

        const gap = Math.max(0, Math.round(state.collapseZ - state.carZ));
        if (gap <= 4) triggerGameOver('The storm caught your response vehicle.');

        // Recycle road chunks & animate collapsing buildings
        chunks.forEach(chunk => {
          if (chunk.group.position.z - CHUNK_LENGTH > state.carZ + 30) {
            const minZ = Math.min(...chunks.map(c => c.group.position.z));
            recycleChunk(chunk, minZ - CHUNK_LENGTH);
          }

          chunk.buildings.forEach(b=>updateBuilding(chunk,b,dt));
          for(const r of chunk.rubble) {
            if(!state.running||!r.userData.hazard||r.userData.hit)continue;
            if(Math.abs(r.position.x-state.carX)<r.userData.halfW+1.25&&Math.abs(chunk.group.position.z+r.position.z-state.carZ)<r.userData.halfD+3.1) {
              // One damage event per rubble pile, while its visible debris stays in place.
              chunk.rubble.forEach(piece=>piece.userData.hit=true);
              state.impacts++;state.speed*=.5;state.shake=1;
              if(state.impacts>=5)triggerGameOver('Fire truck disabled by collision damage.');
            }
          }

          // Obstacle AABB collision check
          chunk.obstacles.forEach(obs => {
            if (obs.userData.hit) return;
            const conePos=obs.getWorldPosition(new THREE.Vector3());
            const worldZ = conePos.z;
            if (Math.abs(worldZ - state.carZ) < 3.45 && Math.abs(conePos.x - state.carX) < obs.userData.halfW + 1.25) {
              obs.userData.hit = true;
              obs.visible = false;
              state.impacts += 1;
              state.speed *= 0.55; // Lose momentum on crash
              state.shake = 1.0;
              if (state.impacts >= 5) triggerGameOver('Vehicle totaled after 5 impacts.');
            }
          });
        });

        if(state.running) updateTraffic(dt);
        // Rough pavement causes continuous drag; potholes add a stronger slowdown.
        // Road damage does not count as a vehicle impact.
        let roughRoad=false, pothole=false;
        for(const chunk of chunks) if(chunk.workZone) {
          const localZ=state.carZ-chunk.group.position.z;
          const workZ=chunk.workLane<0?-60-localZ:localZ;
          if(Math.abs(state.carX-chunk.workLane)<3.3&&workZ<-27&&workZ>-53) {
            roughRoad=true;
            pothole ||= chunk.damageWorld.some(d=>Math.hypot(state.carX-d.x,localZ-d.z)<d.r+1);
          }
        }
        if(roughRoad) {
          state.speed=Math.max(8,state.speed-(pothole?58:37)*dt);
          state.shake=Math.max(state.shake,pothole?.24:.1);
        }
        document.getElementById('road-status').textContent=roughRoad?(pothole?'POTHOLE · SLOWDOWN':'ROUGH ROAD · SLOWDOWN'):'WATCH FOR ROAD WORK / FALLING DEBRIS';

        // Update HUD
        document.getElementById('impacts').textContent = state.impacts;
        document.getElementById('gap').textContent = gap;
        document.getElementById('speed').textContent = Math.round(state.speed * 3.6);
      }

      updateEffects(dt);

      // Blizzard snow movement relative to car
      const posArr = snowPoints.geometry.attributes.position.array;
      for (let i = 0; i < posArr.length; i += 3) {
        posArr[i] -= 12 * dt; // Crosswind
        posArr[i + 1] -= 6 * dt;
        if (posArr[i] < -35) posArr[i] = 35;
        if (posArr[i + 1] < 0) posArr[i + 1] = 25;
      }
      snowPoints.position.z = state.carZ - 20;
      snowPoints.geometry.attributes.position.needsUpdate = true;

      // Chase camera + impact/proximity shake
      state.shake = Math.max(0, state.shake - dt * 2.5);
      const proximityShake = Math.max(0, (25 - (state.collapseZ - state.carZ)) / 25) * 0.25;
      const totalShake = state.shake * 0.6 + proximityShake;

      camera.position.set(
        state.carX * 0.75 + (Math.random() - 0.5) * totalShake,
        5.3 + (Math.random() - 0.5) * totalShake,
        state.carZ + 11.5
      );
      camera.lookAt(state.carX * 0.5, 1.4, state.carZ - 18);

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
    window.emergencyCalls={scene,car,traffic,chunks,updateTraffic,resetGame,get state(){return state}};
  </script>
</body>
</html>
