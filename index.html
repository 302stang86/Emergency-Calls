<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergency Calls</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #cfd8dc; font-family: system-ui, sans-serif; color: #111; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 86px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; gap:8px; flex-wrap:wrap; pointer-events: none;
      font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .panel {
      background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(6px);
      padding: 10px 16px; border-radius: 6px; font-size: 14px;
    }
    #overlay {
      position: fixed; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(225, 232, 236, 0.88); text-align: center; gap: 16px;
    }
    #overlay.active { display: flex; }
    button {
      padding: 12px 28px; font-size: 15px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      background: #111; color: #fff; border: none; border-radius: 4px; cursor: pointer;
    }
    #controls-hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      font-size: 12px; opacity: 0.75; pointer-events: none;
    }
  
    body { background:#1d3345; color:#f4f8ff; }
    #brand {position:fixed;top:20px;left:24px;pointer-events:none;text-shadow:0 2px 12px #132235;}
    #brand b {font-size:clamp(20px,4vw,30px);letter-spacing:.06em} #brand span {color:#ff5858}
    #brand small {display:block; font-size:10px;letter-spacing:.24em;margin-top:5px;color:#d4e6f1}
    .panel {background:rgba(15,32,49,.86);border:1px solid #7694a555;border-radius:12px;box-shadow:0 8px 24px #0c1b2922;font-size:12px;letter-spacing:.04em;}
    #overlay {background:rgba(12,26,42,.93);padding:24px;overflow-y:auto;gap:12px;} #overlay p {max-width:580px;line-height:1.65;color:#d8e6f1} #overlay h1 {font-size:clamp(24px,5vw,48px)}
    button {background:#df343e;border-radius:10px;box-shadow:0 4px 20px #0003;}
    #controls-hint {background:#102336ce;padding:10px 16px;border-radius:20px;opacity:1;white-space:nowrap;}
    #touch {display:none;position:fixed;bottom:25px;left:18px;right:18px;justify-content:space-between;}
    #touch div {display:flex;gap:10px} #touch button {touch-action:none;width:62px;height:62px;padding:0;background:#142f46d9;border:1px solid #d0e5f666;font-size:14px;user-select:none;}
    @media(pointer:coarse) {#touch {display:flex} #controls-hint {bottom:100px;font-size:10px} .panel {padding:10px 8px;font-size:10px} #hud {left:12px;right:12px;gap:6px}}
    #vehicle-select {display:flex;flex-wrap:wrap;gap:10px;margin:6px 0;}
    .veh-btn {flex:1 1 145px;padding:12px 14px;min-height:48px;background:#243b50;border:2px solid #638097;font-size:12px;letter-spacing:.025em;text-transform:none;box-shadow:none;}
    .veh-btn.active {background:#b82433;border-color:#ffb2b9;box-shadow:0 0 0 2px #ff687322;}
    .veh-btn:focus-visible {outline:3px solid #b8e5ff;outline-offset:3px;}
    .veh-btn:disabled,.veh-btn[aria-disabled="true"] {opacity:.6;cursor:not-allowed;}
    #lock-status {display:block;font-size:10px;color:#ff9393;margin-top:4px;}
    @media(max-height:650px) {#overlay.active {justify-content:flex-start;} #overlay h1 {font-size:24px;} #overlay p {font-size:12px;}}
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="brand"><b>EMERGENCY <span>CALLS</span></b><small>FDEC DISPATCH · UNIT 01</small></div>
  <div id="hud">
    <div class="panel">Impacts: <span id="impacts">0</span> / 5</div>
    <div class="panel"><span id="lead-label">Gallagher ahead</span>: <span id="gap">4</span>m</div>
    <div class="panel">Job Site: <span id="distance">2,500</span>m</div>
    <div class="panel">Speed: <span id="speed">0</span> km/h</div>
  </div>

  <div id="road-status" style="position:fixed;top:138px;left:20px;font-size:11px;font-weight:700;letter-spacing:.07em;color:#ffe1a3;background:#142638d9;padding:8px 12px;border-radius:8px;pointer-events:none">KEEP RIGHT AT ROAD WORK</div>
  <div id="controls-hint">W / ↑ Accelerate · A D / ← → Steer · SPACE Brake</div>

  <div id="touch"><div><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button></div><div><button data-key="Space">BRAKE</button><button data-key="ArrowUp">GO</button></div></div>
  <div id="overlay">
    <h1 id="overlay-title">RESPONSE INTERRUPTED</h1>
    <p id="overlay-sub">Reach the job site before Gallagher Fire.</p>
    <div id="vehicle-choice" style="display:grid;gap:8px;text-align:left;width:min(620px,100%);font-size:13px;font-weight:700">
      <span id="vehicle-label">Choose your vehicle</span>
      <div id="vehicle-select" role="group" aria-labelledby="vehicle-label">
        <button type="button" class="veh-btn active" data-veh="firetruck" aria-pressed="true">Fire Truck</button>
        <button type="button" class="veh-btn" data-veh="detailed" aria-pressed="false">Detailed Fire Truck</button>
        <button type="button" class="veh-btn" data-veh="promaster" aria-pressed="false">Ram ProMaster</button>
        <button type="button" class="veh-btn" data-veh="silverado" aria-pressed="false">Silverado</button>
        <button type="button" class="veh-btn" id="corvette-btn" data-veh="corvette" aria-pressed="false">Corvette <span id="lock-status">🔒 (Locked)</span></button>
      </div>
    </div>
    <label id="level-choice" style="display:grid;gap:8px;text-align:left;width:min(360px,100%);font-size:13px;font-weight:700">Choose dispatch level
      <select id="level-select" style="width:100%;padding:12px;border-radius:10px;border:1px solid #71899c;background:#21384d;color:white;font:inherit"></select>
    </label>
    <button id="next-level-btn" style="display:none">Next Level</button>
    <button id="restart-btn">Start Dispatch</button>
    <button id="menu-btn" style="background:#31485c;display:none">Return to Main Menu</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
    import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
    import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
    import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
    import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
    import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
    import {mergeGeometries,toCreasedNormals} from 'three/addons/utils/BufferGeometryUtils.js';

    // --- 1. SCENE, FOG & RENDERER ---
    const FOG_COLOR = 0x6e7e8c;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(FOG_COLOR);
    // Atmospheric fog retains visibility of collapses ahead.
    scene.fog = new THREE.FogExp2(FOG_COLOR, 0.0055);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 360);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const composer=new EffectComposer(renderer);
    composer.setPixelRatio(Math.min(window.devicePixelRatio,1.25));
    composer.addPass(new RenderPass(scene,camera));
    const heatPass=new ShaderPass({uniforms:{tDiffuse:{value:null},time:{value:0},zones:{value:Array.from({length:4},()=>new THREE.Vector4(-2,-2,0,0))},aspect:{value:window.innerWidth/window.innerHeight}},
      vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
      fragmentShader:`uniform sampler2D tDiffuse;uniform float time;uniform float aspect;uniform vec4 zones[4];varying vec2 vUv;void main(){vec2 shift=vec2(0.);for(int i=0;i<4;i++){vec2 d=vUv-zones[i].xy;d.x*=aspect;float mask=exp(-dot(d,d)/max(.00001,zones[i].z*zones[i].z))*zones[i].w;shift+=vec2(sin(vUv.y*150.+time*13.),cos(vUv.x*110.+time*9.))*.0016*mask;}gl_FragColor=texture2D(tDiffuse,clamp(vUv+shift,vec2(.001),vec2(.999)));}`});
    composer.addPass(heatPass);
    const bloomPass=new UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),.22,.5,1.25);composer.addPass(bloomPass);composer.addPass(new OutputPass());
    let bloomPulse=0;

    // --- 2. LIGHTING ---
    const hemiLight = new THREE.HemisphereLight(0xddeeff, 0x4a5568, 0.9);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfff5e4, 1.6);
    dirLight.position.set(40, 70, 30);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.bias = -0.0005;
    dirLight.shadow.normalBias = 0.035;
    Object.assign(dirLight.shadow.camera,{left:-65,right:65,top:75,bottom:-75,near:1,far:240});
    dirLight.shadow.camera.updateProjectionMatrix();
    scene.add(dirLight.target);
    scene.add(dirLight);

    // --- 3. SHARED MATERIALS & CONSTANTS ---
    const LEVELS=[
      {level:1,distance:1500,rivalSpeed:26,aggression:.2,title:'Level 1: Morning Frost'},
      {level:2,distance:2200,rivalSpeed:32,aggression:.4,title:'Level 2: Heavy Sleet'},
      {level:3,distance:3000,rivalSpeed:38,aggression:.7,title:'Level 3: Blizzard Rush'},
      {level:4,distance:4000,rivalSpeed:45,aggression:1,title:'Level 4: Whiteout Emergency'}
    ];
    let currentLevelIndex=0;
    const activeLevel=()=>LEVELS[currentLevelIndex];
    const ROAD_WIDTH = 36;
    const CHUNK_LENGTH = 60;
    const NUM_CHUNKS = 6;

    function createRoadTextures() {
      const w=512,h=512;
      const diff=document.createElement('canvas'),bump=document.createElement('canvas'),rough=document.createElement('canvas');
      diff.width=bump.width=rough.width=w;diff.height=bump.height=rough.height=h;
      const dc=diff.getContext('2d'),bc=bump.getContext('2d'),rc=rough.getContext('2d');
      dc.fillStyle='#222528';dc.fillRect(0,0,w,h);
      bc.fillStyle='#808080';bc.fillRect(0,0,w,h);
      rc.fillStyle='#a0a0a0';rc.fillRect(0,0,w,h);
      const imgData=dc.getImageData(0,0,w,h),bumpData=bc.getImageData(0,0,w,h);
      for(let i=0;i<imgData.data.length;i+=4) {
        const noise=(Math.random()-.5)*35;
        for(let channel=0;channel<3;channel++)imgData.data[i+channel]=Math.min(255,Math.max(0,imgData.data[i+channel]+noise));
        const bNoise=128+Math.random()*50;
        bumpData.data[i]=bumpData.data[i+1]=bumpData.data[i+2]=bNoise;
      }
      dc.putImageData(imgData,0,0);bc.putImageData(bumpData,0,0);
      // Lane paint stays in road geometry to preserve the five-lane layout.
      const wrap=(tex,color=false)=>{
        tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
        if(color)tex.colorSpace=THREE.SRGBColorSpace;
        tex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return tex;
      };
      return {map:wrap(new THREE.CanvasTexture(diff),true),bumpMap:wrap(new THREE.CanvasTexture(bump)),roughnessMap:wrap(new THREE.CanvasTexture(rough))};
    }
    const roadTex=createRoadTextures();
    const realisticRoadMat=new THREE.MeshStandardMaterial({...roadTex,bumpScale:.04,roughness:.75,metalness:.1});
    const roadMat=realisticRoadMat;
    function roadGeometry(width,length) {
      const geo=new THREE.PlaneGeometry(width,length),uv=geo.attributes.uv;
      // World-sized tiling gives asphalt the same grain size on roads and cross streets.
      for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*width/5,uv.getY(i)*length/5);
      return geo;
    }
    const buildingMat = new THREE.MeshStandardMaterial({ color: 0x5c6670, roughness: 0.9 });
    const hazardMat = new THREE.MeshStandardMaterial({ color: 0x8d3b2e, roughness: 0.7 });
    const snowMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 });

    function createFacadeTextures(baseHex,litChance=.45) {
      const w=512,h=512;
      const diff=document.createElement('canvas'),emis=document.createElement('canvas'),bump=document.createElement('canvas');
      diff.width=emis.width=bump.width=w;diff.height=emis.height=bump.height=h;
      const dc=diff.getContext('2d'),ec=emis.getContext('2d'),bc=bump.getContext('2d');
      dc.fillStyle=baseHex;dc.fillRect(0,0,w,h);bc.fillStyle='#c8c8c8';bc.fillRect(0,0,w,h);ec.fillStyle='#000';ec.fillRect(0,0,w,h);
      for(let i=0;i<900;i++){dc.fillStyle=Math.random()>.5?'rgba(255,255,255,.03)':'rgba(0,0,0,.05)';dc.fillRect(Math.random()*w,Math.random()*h,2,18);}
      const cols=4,rows=8,padX=24,padY=16,cellW=w/cols,cellH=h/rows;
      for(let r=0;r<rows;r++)for(let c=0;c<cols;c++) {
        const wx=c*cellW+padX,wy=r*cellH+padY,ww=cellW-padX*2,wh=cellH-padY*2;
        bc.fillStyle='#303030';bc.fillRect(wx-3,wy-3,ww+6,wh+6);
        dc.fillStyle='rgba(255,255,255,.18)';dc.fillRect(wx-4,wy+wh,ww+8,4);
        if(Math.random()<litChance){const color=Math.random()>.3?'#ffdfa8':'#a8d5ff';dc.fillStyle=color;dc.fillRect(wx,wy,ww,wh);ec.fillStyle=color;ec.fillRect(wx,wy,ww,wh);}
        else {dc.fillStyle='#18242e';dc.fillRect(wx,wy,ww,wh);}
      }
      const wrap=(tex,color=false)=>{tex.wrapS=tex.wrapT=THREE.RepeatWrapping;if(color)tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());return tex;};
      return {map:wrap(new THREE.CanvasTexture(diff),true),emissiveMap:wrap(new THREE.CanvasTexture(emis),true),bumpMap:wrap(new THREE.CanvasTexture(bump))};
    }
    const facadeSets=[createFacadeTextures('#566b7d',.5),createFacadeTextures('#6c7d89',.35),createFacadeTextures('#405568',.6)];
    const facadeMaterials=facadeSets.map(set=>new THREE.MeshStandardMaterial({...set,color:0xffffff,emissive:0xffeedd,emissiveIntensity:.85,bumpScale:.15,roughness:.82}));
    const roofMat=new THREE.MeshStandardMaterial({color:0x68727a,roughness:.95});
    function facadeGeometry(w,h,d) {
      const geo=new THREE.BoxGeometry(w,h,d),uv=geo.attributes.uv;
      for(let face=0;face<6;face++)if(face!==2&&face!==3)for(let i=face*4;i<face*4+4;i++) {
        uv.setXY(i,uv.getX(i)*(face<2?d:w)/16,uv.getY(i)*h/32);
      }
      return geo;
    }
    function setFacadeGlow(b,color){const mats=Array.isArray(b.material)?b.material:[b.material];for(const m of new Set(mats))if(m.emissiveMap)m.emissive.setHex(color);}

    // ===================== VEHICLE LIBRARY (shared helpers) =====================
    // Fire engine, with forward cab, equipment body, hose bed and roof ladder.
    const car = new THREE.Group();
    const red = new THREE.MeshStandardMaterial({color:0xc82432,metalness:.35,roughness:.32});
    const white = new THREE.MeshStandardMaterial({color:0xe9f0f3,roughness:.38});
    const dark = new THREE.MeshStandardMaterial({color:0x172634,metalness:.35,roughness:.38});
    const glass = new THREE.MeshStandardMaterial({color:0x193c55,metalness:.6,roughness:.18});
    const chrome = new THREE.MeshStandardMaterial({color:0xb5c5cf,metalness:.85,roughness:.24});
    function box(parent,w,h,d,x,y,z,mat) {
      const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
      m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
    }

    // Soft overcast "sky" so paint, glass and chrome have something to reflect.
    const vehPmrem=new THREE.PMREMGenerator(renderer);
    const vehEnv=(()=>{
      const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d');
      const g=x.createLinearGradient(0,0,0,512);
      g.addColorStop(0,'#8fa6b8');g.addColorStop(.35,'#c9d8e3');g.addColorStop(.49,'#eef3f6');g.addColorStop(.51,'#59656e');g.addColorStop(1,'#1c242b');
      x.fillStyle=g;x.fillRect(0,0,1024,512);
      x.fillStyle='rgba(255,255,255,.6)';
      for(const [px,py,w,h] of [[90,60,200,36],[430,40,260,46],[800,86,170,34],[250,130,120,22]])x.fillRect(px,py,w,h);
      x.fillStyle='rgba(38,50,62,.6)';
      for(let i=0;i<24;i++){const w=22+((i*37)%50),h=34+((i*53)%90);x.fillRect(i*43,256-h,w,h);}
      const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.colorSpace=THREE.SRGBColorSpace;
      const rt=vehPmrem.fromEquirectangular(t);t.dispose();return rt.texture;
    })();
    function canvasTex(w,h,draw,srgb=true,repeat){
      const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
      const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;
      t.wrapS=t.wrapT=THREE.RepeatWrapping;if(repeat)t.repeat.set(repeat[0],repeat[1]);
      t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());return t;
    }
    const diamondBump=canvasTex(64,64,(x,w,h)=>{x.fillStyle='#707070';x.fillRect(0,0,w,h);x.fillStyle='#e0e0e0';for(let i=0;i<2;i++)for(let j=0;j<2;j++){x.save();x.translate(16+i*32,16+j*32);x.rotate(Math.PI/4*(j%2?-1:1)+Math.PI/4);x.fillRect(-9,-3,18,6);x.restore();}},false,[6,3]);
    const slatMap=canvasTex(128,128,(x,w,h)=>{
      const g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,'#aab3b9');g.addColorStop(.5,'#d6dde1');g.addColorStop(1,'#aab3b9');x.fillStyle=g;x.fillRect(0,0,w,h);
      for(let y=0;y<h;y+=7){x.fillStyle='rgba(40,48,56,.55)';x.fillRect(0,y,w,1.6);x.fillStyle='rgba(255,255,255,.35)';x.fillRect(0,y+2,w,1);}
    });
    const VM={
      paint:(hex,o={})=>new THREE.MeshPhysicalMaterial({color:hex,metalness:o.m??.5,roughness:o.r??.32,clearcoat:1,clearcoatRoughness:o.cc??.06,envMap:vehEnv,envMapIntensity:o.e??1.0}),
      glass:new THREE.MeshPhysicalMaterial({color:0x0b141b,metalness:.15,roughness:.04,clearcoat:1,clearcoatRoughness:0,envMap:vehEnv,envMapIntensity:1.9}),
      chrome:new THREE.MeshStandardMaterial({color:0xe4ecf0,metalness:1,roughness:.1,envMap:vehEnv,envMapIntensity:1.25}),
      steel:new THREE.MeshStandardMaterial({color:0xaeb9c0,metalness:.9,roughness:.36,envMap:vehEnv,envMapIntensity:1}),
      alloy:new THREE.MeshStandardMaterial({color:0xc4ccd2,metalness:1,roughness:.22,envMap:vehEnv,envMapIntensity:1.15,side:THREE.DoubleSide}),
      rotor:new THREE.MeshStandardMaterial({color:0x6b7278,metalness:.9,roughness:.45,envMap:vehEnv,envMapIntensity:.6}),
      black:new THREE.MeshStandardMaterial({color:0x14171a,metalness:.25,roughness:.6,envMap:vehEnv,envMapIntensity:.35}),
      trim:new THREE.MeshStandardMaterial({color:0xeef2f4,roughness:.45,envMap:vehEnv,envMapIntensity:.4}),
      plate:new THREE.MeshStandardMaterial({color:0xb4bcc2,metalness:.85,roughness:.42,bumpMap:diamondBump,bumpScale:.8,envMap:vehEnv,envMapIntensity:.8}),
      slat:new THREE.MeshStandardMaterial({map:slatMap,metalness:.6,roughness:.4,envMap:vehEnv,envMapIntensity:.7}),
      hose:new THREE.MeshStandardMaterial({color:0xcdb267,roughness:.9}),
      lens:new THREE.MeshStandardMaterial({color:0xfff6e6,emissive:0xffe6b0,emissiveIntensity:1.1,roughness:.08,metalness:.1}),
      amber:new THREE.MeshBasicMaterial({color:0xff9d1a}),
      carbon:new THREE.MeshStandardMaterial({color:0x101214,metalness:.5,roughness:.35,envMap:vehEnv,envMapIntensity:.5}),
      liner:new THREE.MeshStandardMaterial({color:0x1b1d20,roughness:.95}),
      tail:()=>new THREE.MeshBasicMaterial({color:0xff2b24}),
      reverse:new THREE.MeshBasicMaterial({color:0xf2f6ff}),
    };

    const rbCache=new Map();
    function rb(parent,w,h,d,x,y,z,mat,r=.03,shadow=true){
      const rr=Math.max(.002,Math.min(r,w/2-.001,h/2-.001,d/2-.001));
      const k=[w,h,d,rr].map(v=>v.toFixed(3)).join('_');
      let geo=rbCache.get(k);if(!geo){geo=new RoundedBoxGeometry(w,h,d,2,rr);rbCache.set(k,geo);}
      const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;parent.add(m);return m;
    }
    function cyl(parent,r,len,x,y,z,mat,axis='x',seg=16){
      const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,seg),mat);
      if(axis==='x')m.rotation.z=Math.PI/2;else if(axis==='z')m.rotation.x=Math.PI/2;
      m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;
    }
    // Closed 2D outline [z,y,cornerRadius] -> THREE.Shape with filleted corners (z maps to shape X).
    function polyShape(raw){
      const pts=[];
      for(const p of raw){const q=pts[pts.length-1];if(!q||Math.hypot(q[0]-p[0],q[1]-p[1])>1e-5)pts.push([p[0],p[1],p[2]||0]);}
      if(pts.length>1&&Math.hypot(pts[0][0]-pts.at(-1)[0],pts[0][1]-pts.at(-1)[1])<1e-5)pts.pop();

      const prof=P.map(([r,y])=>new THREE.Vector2(r,y*hw));for(let i=P.length-2;i>=0;i--)prof.push(new THREE.Vector2(P[i][0],-P[i][1]*hw));

      const barrel=new THREE.Mesh(new THREE.CylinderGeometry(rimR*.98,rimR*.98,W*.8,32,1,true),VM.alloy);hold.add(barrel);
      const well=new THREE.Mesh(new THREE.CylinderGeometry(rimR*.95,rimR*.95,.02,32),VM.black);well.position.y=-hw*.25;hold.add(well);
      const rotor=new THREE.Mesh(new THREE.CylinderGeometry(rimR*.82,rimR*.82,.04,32),VM.rotor);rotor.position.y=hw*.05;hold.add(rotor);
      const add=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);hold.add(m);return m;};
      if(style==='alloy'){
        const n=o.spokes||5;
        for(let i=0;i<n;i++){const a=i/n*Math.PI*2,sp=add(new THREE.BoxGeometry(rimR*.82,.045,rimR*.2),VM.alloy,Math.cos(a)*rimR*.46,hw*.45,Math.sin(a)*rimR*.46);sp.rotation.y=-a;}
        add(new THREE.CylinderGeometry(rimR*.2,rimR*.2,.06,20),VM.chrome,0,hw*.5,0);
        const ring=add(new THREE.TorusGeometry(rimR*.95,.022,6,36),VM.alloy,0,hw*.62,0);ring.rotation.x=Math.PI/2;
        if(o.caliper){const c=add(new THREE.BoxGeometry(rimR*.32,.1,rimR*.55),new THREE.MeshStandardMaterial({color:o.caliper,roughness:.4}),rimR*.62,hw*.05,0);c.rotation.y=.25;}
      } else if(style==='budd'){
        add(new THREE.CylinderGeometry(rimR*.97,rimR*.97,.07,32),o.face||VM.trim,0,hw*.5,0);

    }

    function updateGallagherVan(dt) {
      if(!state.running)return;
      const lvl=activeLevel();
      // Positive separation means Gallagher is behind on a route moving toward -Z.
      let desiredSpeed=THREE.MathUtils.clamp(lvl.rivalSpeed+(gallagher.z-state.carZ)*.05,16,56);
      const blocked=lane=>traffic.some(t=>!t.hit&&Math.abs(t.mesh.position.x-lane)<2.7&&t.mesh.position.z<gallagher.z&&t.mesh.position.z>gallagher.z-32)||
        chunks.some(c=>(c.workZone&&Math.abs(c.workLane-lane)<2.8&&Math.abs(c.group.position.z-35-gallagher.z)<40)||c.rubble.some(r=>r.userData.hazard&&Math.abs(r.position.x-lane)<(r.userData.halfW||1)+1.1&&Math.abs(c.group.position.z+r.position.z-gallagher.z)<22));

      gallagher.targetLane=THREE.MathUtils.clamp(gallagher.targetLane,-16,16);

      }
      gallagher.speed=THREE.MathUtils.damp(gallagher.speed,desiredSpeed,-60*Math.log(.95),dt);
      gallagher.z-=gallagher.speed*dt;
      const previous=gallagher.x;
      gallagher.x=THREE.MathUtils.damp(gallagher.x,gallagher.targetLane,2.5*lvl.aggression,dt);
      gallagherVan.position.set(gallagher.x,0,gallagher.z);

      gallagherVan.rotation.y=Math.PI-THREE.MathUtils.clamp((gallagher.x-previous)/Math.max(.001,dt)*.035,-.3,.3);

    function updateUtilities(dt) {

      for(const {p,c,z} of ordered)if(!p.passed&&state.carZ<=z) {

      for(const chunk of chunks)for(const equipment of chunk.obstacles)if(equipment.userData.isDumpTruck) {

      const flash=Math.sin(clock.elapsedTime*14)>0;

      beaconGlow.intensity=flash?9:6;

      if (state.running) {
        const playerBefore=state.carZ,rivalBefore=gallagher.z;
        // Acceleration & Braking
        const accel = keys['KeyW'] || keys['ArrowUp'];
        const brake = keys['Space'] || keys['KeyS'] || keys['ArrowDown'];
        if (accel) state.speed += 28 * dt;
        else if (brake) state.speed -= 45 * dt;
        else state.speed -= 10 * dt; // Natural drag
        const baseMaxSpeed=52;
        const maxSpeed=selectedVehicleType==='corvette'?baseMaxSpeed*1.2:baseMaxSpeed;
        state.speed = THREE.MathUtils.clamp(state.speed, 8, maxSpeed);

        // Steering with slight drift inertia
        const steerInput = (keys['KeyA'] || keys['ArrowLeft'] ? -1 : 0) +
                           (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0);
        state.steerVel = THREE.MathUtils.lerp(state.steerVel, steerInput * 16, 8 * dt);
        state.carX += state.steerVel * dt;
        state.carX = THREE.MathUtils.clamp(state.carX, -ROAD_WIDTH / 2 + 1.3, ROAD_WIDTH / 2 - 1.3);

        // Advance forward (-Z)

            if (Math.abs(worldZ - state.carZ) < (obs.userData.halfD??.35)+3.1 && Math.abs(conePos.x - state.carX) < obs.userData.halfW + 1.25) {
              obs.userData.hit = true;

              state.impacts += 1;

        // Road damage does not count as a vehicle impact.

      // Blizzard snow movement relative to car
